<script>
(() => {
  "use strict";

  // ---- visible error banner (so failures aren't silent) ----
  const errbar = document.createElement("div");
  errbar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:999;background:#c1121f;color:#fff;" +
    "font:12px/1.45 system-ui,sans-serif;padding:8px 12px;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto";
  document.body.appendChild(errbar);
  let shownErr = false;
  function fatal(m) { shownErr = true; errbar.style.display = "block"; errbar.textContent = "⚠ " + m; }
  window.addEventListener("error", e => { if (!shownErr) fatal((e.message || e.error || "script error") + "  @" + String(e.filename || "").split("/").pop() + ":" + e.lineno); });
  window.addEventListener("unhandledrejection", e => { if (!shownErr) fatal("promise: " + (e.reason && (e.reason.message || e.reason))); });
  try { document.getElementById("ver").textContent = "build v4 ✓"; } catch (e) {}
  const $ = id => document.getElementById(id);
  const video = $("cam-video");
  const cam = $("cam"), camCtx = cam.getContext("2d");
  const camTag = $("camTag");
  const game = $("game"), g = game.getContext("2d");
  const hud = $("hud");
  const scrMenu = $("scrMenu"), scrOver = $("scrOver");
  const hScore = $("hScore"), hWalls = $("hWalls"), hLives = $("hLives"), hFlash = $("hFlash");
  const elTurn = $("turn"), turnName = $("turnName"), turnBar = $("turnBar"), turnYou = $("turnYou");
  const turnIcon = $("turnIcon"), turnIconCtx = turnIcon.getContext("2d");

  const POSES = ["OVERHEAD", "SIDE", "LOWER", "CROSS"];
  const POSE_JP = { OVERHEAD: "上（バンザイ）", SIDE: "横（水平）", LOWER: "下（腰）", CROSS: "クロス（胸）" };
  const SHOUTS = ["ﾄﾞｶｰﾝ!!", "ﾌﾞﾁ破ｯﾀ!!", "ﾑｷ ﾑｷ!!", "PERFECT!!", "ﾊﾞｷﾊﾞｷ!!", "ﾅｲｽ ﾊﾞﾙｸ!!"];
  const FAILS = ["ﾍﾞｼｬｯ…", "脱落!!", "ﾎﾈｵﾚﾀ…", "ﾑﾘｨ!!"];

  // =====================================================================
  //  Audio
  // =====================================================================
  let ac = null, master = null, muted = false;
  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
  }
  function noiseBuffer(d) {
    const n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    return b;
  }
  function boom() {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), gg = ac.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.55);
    gg.gain.setValueAtTime(0.95, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 0.62);
    const s = ac.createBufferSource(); s.buffer = noiseBuffer(0.5);
    const f = ac.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(2000, t); f.frequency.exponentialRampToValueAtTime(160, t + 0.45);
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.8, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    s.connect(f); f.connect(ng); ng.connect(master); s.start(t); s.stop(t + 0.5);
  }
  function splat() {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), gg = ac.createGain();
    o.type = "square"; o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.35);
    gg.gain.setValueAtTime(0.5, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 0.42);
    const s = ac.createBufferSource(); s.buffer = noiseBuffer(0.22);
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 380;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.5, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    s.connect(f); f.connect(ng); ng.connect(master); s.start(t); s.stop(t + 0.22);
  }

  // --- gym-rock BGM, tempo = bpm ---
  let bgmOn = false, bgmMode = "menu", bStep = 0, bBar = 0, bNext = 0, bTimer = null, bpm = 140;
  const RIFF = [0, 0, 12, 0, 7, 0, 10, 8], RIFF2 = [3, 3, 15, 3, 10, 3, 8, 7];
  const MEL = [-1, 12, 15, 19, 15, 12, 19, 22, -1, 10, 14, 17, 22, 19, 17, 14];
  function kick(t, v) { const o = ac.createOscillator(), gg = ac.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.12);
    gg.gain.setValueAtTime(v, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 0.19); }
  function snare(t) { const s = ac.createBufferSource(); s.buffer = noiseBuffer(0.2);
    const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1500;
    const gg = ac.createGain(); gg.gain.setValueAtTime(0.34, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    s.connect(f); f.connect(gg); gg.connect(master); s.start(t); s.stop(t + 0.2); }
  function hat(t, open) { const s = ac.createBufferSource(); s.buffer = noiseBuffer(open ? 0.12 : 0.04);
    const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 8000;
    const gg = ac.createGain(); gg.gain.setValueAtTime(open ? 0.1 : 0.14, t); gg.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.12 : 0.045));
    s.connect(f); f.connect(gg); gg.connect(master); s.start(t); s.stop(t + 0.14); }
  function bass(t, semi, dur) {
    const f = 41.2 * Math.pow(2, semi / 12);
    const o = ac.createOscillator(), o2 = ac.createOscillator(), gg = ac.createGain(), flt = ac.createBiquadFilter();
    o.type = "sawtooth"; o2.type = "square"; o.frequency.value = f; o2.frequency.value = f * 2.01;
    flt.type = "lowpass"; flt.frequency.value = 360 + (bpm - 120) * 22; flt.Q.value = 9;
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(0.3, t + 0.012); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(flt); o2.connect(flt); flt.connect(gg); gg.connect(master);
    o.start(t); o2.start(t); o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  }
  function lead(t, semi) {
    const f = 41.2 * Math.pow(2, (semi + 24) / 12);
    const o = ac.createOscillator(), gg = ac.createGain();
    o.type = "square"; o.frequency.setValueAtTime(f, t);
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(0.1, t + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 0.18);
  }
  function bgmTick() {
    if (!bgmOn) return;
    const spb = (60 / bpm) / 4;
    if (bNext < ac.currentTime - 0.4) bNext = ac.currentTime + 0.06;
    while (bNext < ac.currentTime + 0.14) {
      if (!muted) {
        const play = bgmMode === "play", s = bStep, bar2 = bBar % 2;
        if (s % 2 === 0) bass(bNext, (bar2 ? RIFF2 : RIFF)[(s >> 1) % 8], play ? 0.16 : 0.2);
        if (s % 4 === 0) kick(bNext, play ? 0.6 : 0.4);
        if (play && s === 6) kick(bNext, 0.4);
        if (play && (s === 4 || s === 12)) snare(bNext);
        if (s % 2 === 1) hat(bNext, play && s === 7);
        if (play) { const n = MEL[(s + bar2 * 16) % MEL.length]; if (n >= 0 && s % 2 === 0) lead(bNext, (bar2 ? RIFF2[0] : 0) + n); }
      }
      bNext += spb; bStep = (bStep + 1) % 16; if (bStep === 0) bBar++;
    }
    bTimer = setTimeout(bgmTick, 25);
  }
  function startBGM(mode) { bgmMode = mode || "menu"; if (!ac || bgmOn) return; bgmOn = true; bStep = 0; bBar = 0; bNext = ac.currentTime + 0.06; bgmTick(); }
  function setBgmMode(m) { bgmMode = m; }

  // =====================================================================
  //  Buff cartoon macho — back view, chunky. mode: RUN | pose name
  // =====================================================================
  function drawBuff(c, mode, cx, cy, s, col, col2, phase) {
    c.save();
    c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = col; c.fillStyle = col;
    const P = (x, y) => ({ x: cx + x * s, y: cy + y * s });
    const line = (a, b, w) => { c.lineWidth = w * s; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); };
    const disc = (p, r) => { c.beginPath(); c.arc(p.x, p.y, r * s, 0, 7); c.fill(); };
    const mid = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    const run = mode === "RUN";
    const sw = run ? Math.sin(phase) : 0;

    // legs (one up, one down when running)

    syncHud();
    if (GS.lives <= 0) return gameOver();
    GS.nextAt = now + (GS.tumble > 0 ? 1.15 : (GS.comboLeft > 0 ? 0.35 : 0.9));
  }
  function shatter() {
    const W = game.width, H = game.height, cx = W / 2, cy = H * 0.52;
    for (let i = 0; i < 54; i++) {
      const a = Math.random() * 6.28, sp = (5 + Math.random() * 15) * DPR;
      GS.particles.push({ x: cx + (Math.random() - 0.5) * W * 0.5, y: cy + (Math.random() - 0.5) * H * 0.3,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4 * DPR, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5,
        s: (7 + Math.random() * 26), life: 1 });
    }
  }
  function startGame() {
    try { initAudio(); if (ac.state === "suspended") ac.resume(); } catch (e) {}
    Object.assign(GS, { phase: "playing", score: 0, lives: 3, cleared: 0, wall: null, scroll: 0, runPhase: 0, tumble: 0, comboLeft: 0, particles: [], shake: 0, flash: 0 });
    heldPose = null;
    bpm = targetBpm(); setBgmMode("play"); startBGM("play");
    hide(scrMenu); hide(scrOver); hud.hidden = false;
    buildLives(); syncHud(); syncPoseBtns(); resize();
    GS.nextAt = performance.now() / 1000 + 1.6;
    if ($("useCam").checked) initCamera();
  }
  function gameOver() {
    GS.phase = "over"; bpm = 128; setBgmMode("menu");
    $("overStat").innerHTML = `突破した壁 <b style="color:#ffd23f">${GS.cleared}</b> &nbsp;/&nbsp; SCORE <b style="color:#ffd23f">${GS.score}</b>`;
    setTimeout(() => { hud.hidden = true; show(scrOver); }, 900);
  }
  function syncPoseBtns() {
    document.querySelectorAll("#poseBtns button").forEach(b => b.classList.toggle("held", b.dataset.p === heldPose));
  }
  function buildLives() { hLives.innerHTML = ""; for (let i = 0; i < 3; i++) { const d = document.createElement("div"); d.className = "can"; hLives.appendChild(d); } }
  function syncHud() { hScore.textContent = GS.score; hWalls.textContent = GS.cleared; [...hLives.children].forEach((c, i) => c.classList.toggle("lost", i >= GS.lives)); }
  let flashT = null;
  function flashMsg(txt, col) {
    hFlash.textContent = txt; hFlash.style.color = col;
    hFlash.classList.remove("show"); void hFlash.offsetWidth; hFlash.classList.add("show");
    clearTimeout(flashT); flashT = setTimeout(() => hFlash.classList.remove("show"), 750);
  }

  function update(dt, now) {
    GS.flash *= Math.pow(0.05, dt);
    GS.shake *= Math.pow(0.02, dt);
    if (GS.shake < 0.3) GS.shake = 0;
    if (bpm < targetBpm() && GS.phase === "playing") bpm = Math.min(targetBpm(), bpm + dt * 6);

    if (GS.phase === "menu") { GS.runPhase += dt * 5; GS.scroll += dt * 4; }
    if (GS.phase === "playing") {
      GS.runPhase += dt * (7 + tier() * 2.2);
      GS.scroll += dt * runSpeed();
      if (GS.tumble > 0) { GS.tumble = Math.min(1.4, GS.tumble + dt * 1.6); if (GS.tumble >= 1.4) GS.tumble = 0; }
      if (!GS.wall && GS.tumble === 0 && now >= GS.nextAt) spawnWall(now);
      if (GS.wall) {
        const w = GS.wall, p = (now - w.t0) / w.dur;
        // NPC bursts as the wall passes each one
        for (let i = 0; i < LEAD.length; i++) {
          const pz = 1 - (LEAD[i].z - YOU_Z) / (SPAWN_Z - YOU_Z);
          if (w.npc <= i && p >= pz) { w.npc = i + 1; GS.shake = Math.max(GS.shake, 7); if (!muted && ac) kick(ac.currentTime, 0.5); }
        }
        w.shown = (w.feint && p < 0.82) ? w.decoy : w.need;
        if (w.feint && p >= 0.82 && turnName.textContent === "？？？") turnName.textContent = POSE_JP[w.need];
        if (p >= 1) resolveWall(now);
      }
    }

    for (const pt of GS.particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.6 * DPR; pt.rot += pt.vr; pt.life -= dt * 1.1; }
    GS.particles = GS.particles.filter(p => p.life > 0);
  }

  // =====================================================================
  //  Rendering  (quarter-view perspective road + running crowd)
  // =====================================================================
  let DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const gr = game.getBoundingClientRect();
    game.width = Math.max(2, gr.width * DPR | 0); game.height = Math.max(2, gr.height * DPR | 0);
    const cr = cam.getBoundingClientRect();
    cam.width = Math.max(2, cr.width * DPR | 0); cam.height = Math.max(2, cr.height * DPR | 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 250));

  function scaleOf(z) { return 3.4 / (3.4 + Math.max(-1.5, z)); }
  // drawBuff `s` so the figure is `frac` of canvas height when at the player's depth
  function figScale(sc, frac) { return game.height * (frac || 0.5) * (sc / scaleOf(YOU_Z)) / 224; }
  function project(z, worldX) {
    const W = game.width, H = game.height;
    const horY = H * 0.30, botY = H * 1.02;
    const sc = scaleOf(z);
    const y = horY + (botY - horY) * sc;
    const roadHalf = (W * 0.06 + (W * 0.72 - W * 0.06) * sc);
    const x = W / 2 + worldX * roadHalf * 2;
    return { x, y, sc, roadHalf };
  }

  function drawScene(now) {
    const W = game.width, H = game.height;
    const horY = H * 0.30;
    g.setTransform(1, 0, 0, 1, 0, 0);
    let ox = 0, oy = 0;
    if (GS.shake > 0) { ox = (Math.random() - 0.5) * GS.shake * DPR; oy = (Math.random() - 0.5) * GS.shake * DPR; }
    g.translate(ox, oy);
    const M = 50;

    g.fillStyle = "#141118"; g.fillRect(-M, -M, W + 2 * M, H + 2 * M);   // off-road void

    // sky — collapsing-factory glow
    let sky = g.createLinearGradient(0, -M, 0, horY);
    sky.addColorStop(0, "#3a1c0a"); sky.addColorStop(0.6, "#7a2f10"); sky.addColorStop(1, "#e0651f");
    g.fillStyle = sky; g.fillRect(-M, -M, W + 2 * M, horY + M);
    // distant smoke puffs
    g.fillStyle = "rgba(20,12,8,0.5)";
    for (let i = 0; i < 5; i++) {
      const px = ((i * 173 + now * 6) % (W + 200)) - 100;
      g.beginPath(); g.arc(px, horY * (0.3 + (i % 3) * 0.18), 40 + i * 8, 0, 7); g.fill();
    }

    // road
    const near = project(YOU_Z - 0.6, 0), far = project(SPAWN_Z + 8, 0);
    g.fillStyle = "#26262c";
    g.beginPath();
    g.moveTo(W / 2 - far.roadHalf, far.y); g.lineTo(W / 2 + far.roadHalf, far.y);
    g.lineTo(W / 2 + near.roadHalf, near.y); g.lineTo(W / 2 - near.roadHalf, near.y);
    g.closePath(); g.fill();
    // ground rungs scrolling toward camera
    const SP = 2.2;
    for (let i = 0; i < 26; i++) {
      const z = SPAWN_Z + 6 - ((i * SP + (GS.scroll % SP)));
      if (z < YOU_Z - 0.6) continue;
      const pr = project(z, 0);
      g.fillStyle = (Math.floor((z) / SP + GS.scroll / SP) % 2) ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.16)";
      g.fillRect(W / 2 - pr.roadHalf, pr.y - Math.max(1, 5 * pr.sc), pr.roadHalf * 2, Math.max(1, 10 * pr.sc));
    }
    // roadside hazard poles
    for (let i = 0; i < 14; i++) {
      const z = SPAWN_Z + 6 - ((i * 3.4 + (GS.scroll % 3.4)));
      if (z < YOU_Z) continue;
      for (const sgn of [-1, 1]) {
        const pr = project(z, sgn * 0.62);
        const h = 60 * pr.sc;
        g.fillStyle = "#ffd23f"; g.fillRect(pr.x - 3 * pr.sc, pr.y - h, 6 * pr.sc, h);
        g.fillStyle = "#111"; g.fillRect(pr.x - 3 * pr.sc, pr.y - h, 6 * pr.sc, h / 2);
      }
    }

    // --- draw entities sorted far -> near ---
    const ents = [];
    for (let i = LEAD.length - 1; i >= 0; i--) ents.push({ z: LEAD[i].z, kind: "npc", i });
    if (GS.wall) {
      const w = GS.wall, p = (now - w.t0) / w.dur;
      const wz = SPAWN_Z - (SPAWN_Z - YOU_Z) * p;
      ents.push({ z: wz, kind: "wall", p });
    }
    ents.push({ z: YOU_Z, kind: "you" });
    ents.sort((a, b) => b.z - a.z);

    for (const e of ents) {
      if (e.kind === "npc") {
        const L = LEAD[e.i], pr = project(L.z, L.x);
        const w = GS.wall;
        let mode = "RUN";
        if (w) { const p = (now - w.t0) / w.dur; const pz = 1 - (L.z - YOU_Z) / (SPAWN_Z - YOU_Z); if (p > pz - 0.16 && p < pz + 0.12) mode = w.shown; }
        const hN = heroH(pr.sc, 0.5);
        if (!drawHero(g, mode, pr.x, pr.y - hN * 0.46, hN, GS.runPhase + e.i * 1.6, "tint")) {
          const sN = figScale(pr.sc, 0.5);
          drawBuff(g, mode, pr.x, pr.y - 118 * sN, sN, "#2b2b30", "#ff5e3a", GS.runPhase + e.i * 1.6);
        }
      } else if (e.kind === "wall") {
        drawWall(e.p, now);
      } else {
        drawYou(now);
      }
    }

    // particles
    for (const pt of GS.particles) {
      g.save(); g.translate(pt.x, pt.y); g.rotate(pt.rot);
      g.fillStyle = `rgba(140,140,148,${Math.max(0, pt.life)})`;
      const s = pt.s * DPR; g.fillRect(-s / 2, -s / 2, s, s);
      g.restore();
    }

    // flash
    if (GS.flash > 0.02) { g.fillStyle = `rgba(${GS.flashCol},${GS.flash * 0.6})`; g.fillRect(-60, -60, W + 120, H + 120); }

    g.setTransform(1, 0, 0, 1, 0, 0);
  }

  function drawWall(p, now) {
    const W = game.width, H = game.height;
    const w = GS.wall;
    const wz = SPAWN_Z - (SPAWN_Z - YOU_Z) * p;
    const pr = project(wz, 0);
    const slabW = Math.min(W * 1.5, pr.roadHalf * 2.3 + W * 0.1);
    const slabH = Math.min(H * 1.5, slabW * 0.9);
    const cx = W / 2, cy = pr.y - slabH * 0.52;
    const figS = Math.min(slabW, slabH) / SPAN * 0.86;

    g.save();
    const gx0 = cx - slabW / 2, gy0 = cy - slabH / 2;
    roundRect(g, gx0, gy0, slabW, slabH, Math.min(14 * DPR, slabW * 0.2)); g.clip();
    const bt = Math.min(slabW * 0.24, slabH * 0.24, Math.max(8 * DPR, slabW * 0.045));
    g.lineWidth = bt * 1.1;
    for (let i = -slabH; i < slabW + slabH; i += bt * 2) {
      g.strokeStyle = (((i + slabH) / (bt * 2)) | 0) % 2 ? "#141414" : "#ffd23f";
      g.beginPath(); g.moveTo(gx0 + i, gy0 - 6); g.lineTo(gx0 + i + slabH + 12, gy0 + slabH + 6); g.stroke();
    }
    const grd = g.createLinearGradient(gx0, gy0, gx0 + slabW, gy0 + slabH);
    grd.addColorStop(0, "#8a8a90"); grd.addColorStop(0.5, "#a6a6ad"); grd.addColorStop(1, "#6e6e75");
    roundRect(g, gx0 + bt, gy0 + bt, slabW - bt * 2, slabH - bt * 2, 10 * DPR);
    g.fillStyle = grd; g.fill();
    g.strokeStyle = "rgba(0,0,0,0.4)"; g.lineWidth = 2 * DPR; g.stroke();
    g.strokeStyle = "rgba(0,0,0,0.2)"; g.lineWidth = 2 * DPR;
    for (let i = 0; i < 5; i++) {
      g.beginPath(); let px = gx0 + (i + 0.5) / 5 * slabW, py = gy0 + bt;
      g.moveTo(px, py);
      for (let k = 0; k < 4; k++) { px += Math.sin(i * 3 + k * 1.7) * slabW * 0.11; py += (slabH - bt * 2) * 0.27; g.lineTo(px, py); }
      g.stroke();
    }
    g.restore();

    // punch a person-shaped hole (reveals the road behind), with a yellow rim
    const hi = heroImg(w.shown, null);
    if (hi) {
      const holeH = figS * 224, hw = holeH * hi.width / hi.height;
      const ha = heroImg(w.shown, "halo");
      if (ha) g.drawImage(ha, cx - hw * 1.07 / 2, cy - holeH * 1.07 / 2, hw * 1.07, holeH * 1.07);
      g.globalCompositeOperation = "destination-out";
      g.drawImage(hi, cx - hw / 2, cy - holeH / 2, hw, holeH);
      g.globalCompositeOperation = "source-over";
    } else {
      g.save(); g.globalAlpha = 0.9;
      drawBuff(g, w.shown, cx, cy, figS * 1.09, "#ffd23f", "#ffd23f", 0);
      g.restore();
      g.globalCompositeOperation = "destination-out";
      drawBuff(g, w.shown, cx, cy, figS, "#000", "#000", 0);
      g.globalCompositeOperation = "source-over";
    }
  }

  function drawYou(now) {
    const W = game.width, H = game.height;
    const pr = project(YOU_Z, 0.02);
    let sc = figScale(pr.sc, 0.5);
    let cx = pr.x, cy = pr.y - 118 * sc, rot = 0;
    if (GS.tumble > 0) {
      const tt = Math.min(1, GS.tumble);
      cx += tt * W * 0.55; cy -= Math.sin(tt * Math.PI) * H * 0.4; rot = tt * 7; sc *= (1 - tt * 0.55);
    }
    const w = GS.wall;
    let mode = "RUN";
    if (w && GS.tumble === 0) {
      const p = (now - w.t0) / w.dur;
      if (p > 0.42) mode = currentPose() || "RUN";
    }
    g.save(); g.translate(cx, cy); g.rotate(rot);
    g.shadowColor = "rgba(255,224,120,0.95)"; g.shadowBlur = 16 * DPR;
    if (!drawHero(g, mode, 0, 0, sc * 224, GS.runPhase, null)) {
      g.shadowBlur = 0;
      drawBuff(g, mode, 0, 0, sc * 1.1, "#ffe37a", "#ffe37a", GS.runPhase);
      drawBuff(g, mode, 0, 0, sc, "#1f1f24", "#2f6bff", GS.runPhase);
    }
    g.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawCam() {
    if (!camActive) return;
    const cw = cam.width, ch = cam.height;
    camCtx.clearRect(0, 0, cw, ch);
    if (!video.videoWidth) { camCtx.fillStyle = "#000"; camCtx.fillRect(0, 0, cw, ch); return; }
    const va = video.videoWidth / video.videoHeight, caR = cw / ch;
    let dw = cw, dh = ch, dx = 0, dy = 0;
    if (va > caR) { dh = ch; dw = ch * va; dx = (cw - dw) / 2; } else { dw = cw; dh = cw / va; dy = (ch - dh) / 2; }
    camCtx.save(); camCtx.translate(cw, 0); camCtx.scale(-1, 1);
    camCtx.drawImage(video, dx, dy, dw, dh); camCtx.restore();
    camCtx.fillStyle = "rgba(6,8,14,0.25)"; camCtx.fillRect(0, 0, cw, ch);

    if (landmarks) {
      const P = i => { const l = landmarks[i]; return { x: cw - (dx + l.x * dw), y: dy + l.y * dh, v: vis(l) }; };
      const seg = (a, b) => { const p = P(a), q = P(b); if (!p.v || !q.v) return; camCtx.beginPath(); camCtx.moveTo(p.x, p.y); camCtx.lineTo(q.x, q.y); camCtx.stroke(); };
      camCtx.lineWidth = Math.max(3, cw * 0.02); camCtx.lineCap = "round";
      camCtx.strokeStyle = "rgba(53,224,127,0.95)";
      seg(11, 12); seg(11, 13); seg(13, 15); seg(12, 14); seg(14, 16);
      for (const i of [0, 11, 12, 13, 14, 15, 16]) { const p = P(i); if (!p.v) continue; camCtx.fillStyle = i >= 15 ? "#ffd23f" : "#35e07f"; camCtx.beginPath(); camCtx.arc(p.x, p.y, camCtx.lineWidth, 0, 7); camCtx.fill(); }
    }
  }

  // "your pose" call-out
  function updateTurnUI(now) {
    const w = GS.wall;
    let on = false, p = 0;
    if (w && GS.phase === "playing" && GS.tumble === 0) { p = (now - w.t0) / w.dur; on = p >= 0.42; }
    elTurn.classList.toggle("on", on);
    if (on) {
      turnIconCtx.clearRect(0, 0, 140, 140);
      if (!drawHero(turnIconCtx, w.shown, 70, 76, 128, 0, null))
        drawBuff(turnIconCtx, w.shown, 70, 74, 0.30, "#ffd23f", "#ffd23f", 0);
      const gg = Math.max(0, Math.min(1, (1 - p) / 0.58));
      turnBar.style.transform = `scaleX(${gg})`;
      turnBar.style.background = gg < 0.25 ? "#ff4040" : gg < 0.55 ? "#ffd23f" : "#35e07f";
      const you = currentPose();
      turnYou.textContent = "あなた: " + (you ? POSE_JP[you] : "—");
      turnYou.className = "you " + (you ? (you === w.need ? "ok" : "no") : "");
    }
  }

  // =====================================================================
  //  Loop
  // =====================================================================
  let last = 0, frameErr = false;
  function frame(ts) {
    requestAnimationFrame(frame);
    try {
      const now = ts / 1000;
      const dt = Math.min(0.05, (now - last) || 0); last = now;
      update(dt, now);
      drawScene(now);
      drawCam();
      updateTurnUI(now);
    } catch (err) {
      if (!frameErr) { frameErr = true; fatal("render: " + (err && (err.message || err)) + "\n" + String(err && err.stack || "").split("\n").slice(1, 3).join("\n")); }
    }
  }
  requestAnimationFrame(frame);

  // =====================================================================
  //  Screens + input
  // =====================================================================
  function show(el) { el.hidden = false; }
  function hide(el) { el.hidden = true; }

  const tap = (el, fn) => { el.addEventListener("pointerdown", e => { e.preventDefault(); fn(e); }); el.addEventListener("click", e => e.preventDefault()); };

  tap($("btnStart"), startGame);
  tap($("btnAgain"), () => { hide(scrOver); startGame(); });
  tap($("btnMute"), () => {
    muted = !muted; $("btnMute").innerHTML = muted ? "&#128263;" : "&#128266;";
    if (master) master.gain.value = muted ? 0 : 0.55;
  });
  tap($("btnCam"), () => { camTried = false; initCamera(); });

  // pose input — on-screen buttons + keyboard
  document.querySelectorAll("#poseBtns button").forEach(b => tap(b, () => setPose(b.dataset.p)));
  const KEYMAP = { a: "OVERHEAD", s: "SIDE", d: "LOWER", f: "CROSS", 1: "OVERHEAD", 2: "SIDE", 3: "LOWER", 4: "CROSS" };
  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (KEYMAP[k]) { e.preventDefault(); setPose(KEYMAP[k]); }
    else if ((k === " " || k === "enter") && GS.phase !== "playing") { e.preventDefault(); (GS.phase === "over" ? (hide(scrOver), startGame()) : startGame()); }
  });

  // menu marching row + pose guide
  try { (function buildMenu() {
    const row = $("menuRow");
    for (let i = 0; i < 3; i++) {
      const im = document.createElement("img");
      im.src = "data:image/png;base64," + SPRITE_DATA.RUN;
      row.appendChild(im);
    }
    const names = { OVERHEAD: "上・バンザイ", SIDE: "横・水平", LOWER: "下・腰", CROSS: "胸クロス" };
    const guide = $("poseGuide");
    for (const pn of POSES) {
      const d = document.createElement("div");
      d.innerHTML = `<img src="data:image/png;base64,${SPRITE_DATA[pn]}"><span>${names[pn]}</span>`;
      guide.appendChild(d);
    }
  })(); } catch (err) { fatal("menu build: " + (err && (err.message || err))); }

  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  resize();
})();
</script>
<script>
  (function () {
    var v = document.getElementById("ver");
    if (v && v.textContent.indexOf("✓") === -1 && v.textContent.indexOf("ERR") === -1) {
      v.style.color = "#ffb020"; v.style.opacity = 1;
      v.textContent = "build v4 — ゲームscriptが実行されていません";
    }
  })();
</script>
</body>
</html>
