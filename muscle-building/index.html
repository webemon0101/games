<style>

  #console::before{
    content:""; position:absolute; inset:7px; border-radius:24px;

  .screw{ position:absolute; width:9px; height:9px; border-radius:50%;

    box-shadow:inset 0 0 2px rgba(0,0,0,.5); }
  .screw.tl{ top:10px; left:10px; } .screw.tr{ top:10px; right:10px; }
  .screw.bl{ bottom:12px; left:10px; } .screw.br{ bottom:12px; right:10px; }

  .toprow{ display:flex; gap:5px; justify-content:center; align-items:center; flex-wrap:wrap; margin-bottom:10px; }

    font-family:inherit; font-weight:800; font-size:9.5px; letter-spacing:.3px;
    color:#2c2c34; background:linear-gradient(#ffffff,#d7dae1);
    border:1px solid #9295a0; border-radius:16px; padding:5px 9px; cursor:pointer;
    box-shadow:0 2px 0 #8b8e99, 0 3px 4px rgba(0,0,0,.3);
  }
  .mode.sm{ padding:5px 8px; }
  .mode:active{ transform:translateY(2px); box-shadow:0 0 0 #8b8e99; }

  .screenwrap{

  .rb:active{ transform:translateY(4px); box-shadow:0 1px 0 #83868f, 0 3px 6px rgba(0,0,0,.4), inset 0 2px 5px rgba(255,255,255,.7); }

<body>
<div id="stage">
  <div id="console">
    <span class="screw tl"></span><span class="screw tr"></span>

      <div class="agrp">
        <button class="rb ab" id="bA"><span class="big">A</span><span class="lab">頭上ポーズ</span></button>

      </div>

    <div class="hint">&larr;&rarr; 移動 ／ A 上から来る資材をキャッチ ／ B 横から来る障害物を弾く<br>3回ミスで終了・1000点（100階）でエンディング</div>
  </div>

<script>
(function(){
"use strict";

/* ================= helpers ================= */
var NS="http://www.w3.org/2000/svg";
var lcd=document.getElementById("lcd");
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function E(tag,a){
  var e=document.createElementNS(NS,tag);
  for(var k in a) e.setAttribute(k,a[k]);
  lcd.appendChild(e);
  return e;
}
function col(on){ return on ? "#1A1A1A" : "#33402f"; }
function op(on){ return on ? 0.95 : 0.15; }
function disc(x,y,r,on){ E("circle",{cx:x,cy:y,r:r,fill:col(on),opacity:op(on)}); }
function ring(x,y,r,on,w){ E("circle",{cx:x,cy:y,r:r,fill:"none",stroke:col(on),"stroke-width":w||2.4,opacity:op(on)}); }
function rectf(x,y,w,h,on,rx){ E("rect",{x:x,y:y,width:w,height:h,rx:rx||1.5,fill:col(on),opacity:op(on)}); }
function lineC(x1,y1,x2,y2,on,w){ E("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col(on),"stroke-width":w||5,"stroke-linecap":"round",opacity:op(on)}); }
function polyf(pts,on){ E("polygon",{points:pts,fill:col(on),opacity:op(on)}); }
function pathf(d,on){ E("path",{d:d,fill:col(on),opacity:op(on)}); }
function paths(d,on,w){ E("path",{d:d,fill:"none",stroke:col(on),"stroke-width":w||3,"stroke-linecap":"round","stroke-linejoin":"round",opacity:op(on)}); }
function txt(x,y,s,str,on,anchor){ var e=E("text",{x:x,y:y,"font-family":"'Courier New',monospace","font-weight":"bold","font-size":s,fill:col(on),opacity:op(on),"text-anchor":anchor||"middle"}); e.textContent=str; }

/* ================= 7-seg ================= */
var SEG7={
 "0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd",
 "6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg",
 "A":"abcefg","b":"cdefg","F":"aefg","-":"g"," ":""
};
function digit(x,y,w,h,ch,litGhost){
  var t=Math.max(2.5,w*0.18), vL=(h-3*t)/2;
  var on=SEG7[ch]||"";
  var def={
    a:[x+t,y,w-2*t,t], f:[x,y+t,t,vL], b:[x+w-t,y+t,t,vL],
    g:[x+t,y+(h-t)/2,w-2*t,t], e:[x,y+(h+t)/2,t,vL], c:[x+w-t,y+(h+t)/2,t,vL],
    d:[x+t,y+h-t,w-2*t,t]
  };
  for(var s in def){
    var r=def[s], lit=on.indexOf(s)>=0;
    if(litGhost || lit) E("rect",{x:r[0],y:r[1],width:r[2],height:r[3],rx:t*0.4,fill:col(lit),opacity:op(lit)});
  }
}
function drawScore(v){
  var str=(""+Math.min(9999,v)); while(str.length<4) str="0"+str;
  for(var i=0;i<4;i++) digit(150+i*26, 10, 21, 30, str.charAt(i), true);
}

/* ================= geometry ================= */
var LANEX=[92,196,300];
var HERO_Y=192;                 // hero foot-ish baseline
var SIDE_Y=174;                 // incoming obstacle height (hero torso)
var TOP_STEPS=9;                // fine stations for a falling material (last = arrival)
var SIDE_STEPS=9;               // fine stations for an incoming obstacle (last = arrival)
var TOP_Y0=32, TOP_Y1=160;
var SIDE_X_L=20, SIDE_X_R=346;

function topPath(lane){
  var x=LANEX[lane], p=[];
  for(var i=0;i<TOP_STEPS;i++){
    var f=i/(TOP_STEPS-1);
    p.push([ x, TOP_Y0 + (TOP_Y1-TOP_Y0)*f ]);
  }
  return p;
}
function sidePath(origin,target){
  var ex = (origin==="L") ? SIDE_X_L : SIDE_X_R;
  var tx = LANEX[target], p=[];
  for(var i=0;i<SIDE_STEPS;i++){
    var f=i/(SIDE_STEPS-1);
    p.push([ ex + (tx-ex)*f, SIDE_Y ]);
  }
  return p;
}

/* ================= audio ================= */
var actx=null, soundOn=true;
function ac(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} return actx; }
function blip(f,d,type,v,slideTo){
  if(!soundOn) return; var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain(), n=c.currentTime;
    o.type=type||"square"; o.frequency.setValueAtTime(f,n);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), n+d);
    g.gain.setValueAtTime(0.0001,n);
    g.gain.linearRampToValueAtTime(v||0.12,n+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(g); g.connect(c.destination); o.start(n); o.stop(n+d+0.03);
  }catch(e){}
}
function noise(d,v){
  if(!soundOn) return; var c=ac(); if(!c) return;
  try{
    var len=Math.floor(c.sampleRate*d), b=c.createBuffer(1,len,c.sampleRate), dd=b.getChannelData(0);
    for(var i=0;i<len;i++) dd[i]=(Math.random()*2-1)*(1-i/len);
    var s=c.createBufferSource(), g=c.createGain();
    s.buffer=b; g.gain.value=v||0.3; s.connect(g); g.connect(c.destination); s.start();
  }catch(e){}
}
function sfxTic(){ noise(0.02,0.10); }
function sfxTempo(){ blip(1250+tier()*180, 0.026, "square", 0.045); }
function sfxCatch(){ blip(1400,0.045,"square",0.13); setTimeout(function(){ blip(2050,0.06,"square",0.11); },26); }
function sfxDeflect(){ blip(300,0.04,"square",0.15); noise(0.05,0.32); setTimeout(function(){ blip(1900,0.05,"square",0.1); },20); }
function sfxMiss(){ blip(1000,0.5,"sawtooth",0.18,90); setTimeout(function(){ noise(0.15,0.14); },150); }
function sfxFeint(){ blip(1700,0.05,"square",0.08,900); }
function sfxRecover(){ [700,1050,1400].forEach(function(f,i){ setTimeout(function(){ blip(f,0.1,"square",0.12); },i*80); }); }
function sfxGameOver(){ [340,270,210,150].forEach(function(f,i){ setTimeout(function(){ blip(f,0.22,"sawtooth",0.14); },i*150); }); }
function sfxFanfare(){ [523,659,784,1047,1319,1047,1319,1568,2093].forEach(function(f,i){ setTimeout(function(){ blip(f,0.14,"square",0.13); },i*95); }); }

/* ================= state ================= */
var mode="A", state="attract";
var score=0, miss=0;
var heroLane=1, heroPose="idle", poseT=0;
var objs=[], nextId=1, spawnTimer=0, altTop=true;
var tickN=0, blink=0, timer=null, missFlashT=0, msg=null, msgT=0, recovered200=false, winT=0;

function tier(){
  var s=score, b=(mode==="B")?1:0;
  var tt = s<100?0 : s<200?1 : s<400?2 : s<700?3 : 4;
  return Math.min(4, tt+b);
}
function intervalMs(){ return [400,320,250,190,120][tier()]; }
function spawnGap(){ return [9,9,7,7,5][tier()]; }
function maxObjs(){ return tier()>=4 ? 2 : (tier()>=2 ? 2 : 1); }
function poseHoldTicks(){ return tier()<=1 ? 4 : (tier()<=3 ? 3 : 2); }
function feintChance(){ return tier()>=3 ? 0.4 : 0; }
function birdChance(){ return tier()===0 ? 0 : (tier()===1 ? 0.25 : 0.4); }

function setMsg(s){ msg=s; msgT=7; }

/* ================= flow ================= */
function attract(){
  clearTimeout(timer);
  state="attract"; mode="A"; score=0; miss=0; heroLane=1; heroPose="idle"; poseT=0;
  objs=[]; recovered200=false; winT=0;
  objs.push(mkTop(1));
  render();
  demoLoop();
}
function demoLoop(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(state!=="attract") return;
    tickN++; blink^=1;
    var o=objs[0];
    o.si++;
    if(o.si>=o.path.length-1){
      heroLane=o.lane; heroPose=(o.needPose==="A")?"A":"B"; poseT=1;
      objs[0] = (Math.random()<0.5) ? mkTop(o.id+1) : mkSide(o.id+1);
    } else if(poseT<=0) heroPose="idle";
    if(poseT>0) poseT--;
    render();
    demoLoop();
  }, 460);
}

function mkTop(id){
  var lane=Math.floor(Math.random()*3);
  var kind=Math.random()<0.5?"beam":"cement";
  return { id:id, cat:"top", kind:kind, lane:lane, needPose:"A", path:topPath(lane), si:0, dead:false, dt:0, feint:false, feinted:false, result:null };
}
function mkSide(id){
  var origin=Math.random()<0.5?"L":"R";
  var target=Math.floor(Math.random()*3);
  var bird = Math.random()<birdChance();
  var kind = bird ? "bird" : "ball";
  var feint = bird && Math.random()<feintChance();
  return { id:id, cat:"side", kind:kind, origin:origin, lane:target, needPose:"B", path:sidePath(origin,target), si:0, dead:false, dt:0, feint:feint, feinted:false, result:null };
}

function newGame(m){
  ac(); clearTimeout(timer);
  mode=m; state="ready"; score=0; miss=0; heroLane=1; heroPose="idle"; poseT=0;
  objs=[]; nextId=1; spawnTimer=0; altTop=true; tickN=0; missFlashT=0; recovered200=false; winT=0;
  msg="READY"; msgT=99;
  render();
  var rc=0;
  var rd=function(){
    blip(760,0.07,"square",0.1); rc++;
    if(rc>=3){ msg=null; state="play"; render(); loop(); }
    else timer=setTimeout(rd,400);
  };
  timer=setTimeout(rd,420);
}

function loop(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(state!=="play") return;
    tickN++; blink^=1;
    if(missFlashT>0) missFlashT--;
    if(poseT>0){ poseT--; if(poseT<=0) heroPose="idle"; }
    if(msgT>0){ msgT--; if(msgT<=0) msg=null; }
    step();
    if(state==="play"){ if(tickN%2===0) sfxTempo(); render(); loop(); }
    else render();
  }, intervalMs());
}

function doMiss(){
  miss++; missFlashT=6; sfxMiss();
  setMsg("ミス！");
  if(miss>=3) gameOver();
}
function checkEvents(){
  if(!recovered200 && score>=200){
    recovered200=true;
    if(miss>0){ miss--; setMsg("ミス かいふく！"); sfxRecover(); }
  }
  if(score>=1000 && state==="play") winGame();
}

function resolve(o){
  var ok = (heroLane===o.lane) && (heroPose===o.needPose) && poseT>0;
  if(ok){
    score+=10;
    o.result="ok";
    if(o.needPose==="A"){ sfxCatch(); setMsg("キャッチ！ +10  "+Math.floor(score/10)+"階"); }
    else { sfxDeflect(); setMsg("はじき返した！ +10"); }
  } else {
    o.result="miss";
    doMiss();
  }
  o.dead=true; o.dt=0;
  checkEvents();
}

function step(){
  // spawn
  if(spawnTimer>0) spawnTimer--;
  var live=0;
  for(var q=0;q<objs.length;q++) if(!objs[q].dead) live++;
  if(spawnTimer<=0 && live<maxObjs()){
    var o;
    if(tier()===0) o=mkTop(nextId++);
    else if(tier()>=2){ o = altTop ? mkTop(nextId++) : mkSide(nextId++); altTop=!altTop; }
    else o = (Math.random()<birdChance()) ? mkSide(nextId++) : mkTop(nextId++);
    objs.push(o);
    spawnTimer=spawnGap();
  }
  // advance
  var keep=[];
  for(var i=0;i<objs.length;i++){
    var ob=objs[i];
    if(ob.dead){ ob.dt++; if(ob.dt<2) keep.push(ob); continue; }
    ob.si++;
    // feint shortly before arrival (leaves ~2 ticks to react)
    if(ob.feint && !ob.feinted && ob.si===ob.path.length-3){
      var nl = clamp(ob.lane + (Math.random()<0.5?-1:1), 0, 2);
      if(nl===ob.lane) nl = clamp(ob.lane + (ob.lane===0?1:-1),0,2);
      ob.lane=nl;
      ob.path=sidePath(ob.origin,nl);
      ob.feinted=true;
      sfxFeint(); setMsg("フェイント！");
    }
    if(ob.si>=ob.path.length-1){
      resolve(ob);
      keep.push(ob);
    } else keep.push(ob);
  }
  objs=keep;
}

function gameOver(){
  state="over"; clearTimeout(timer); sfxGameOver();
  msg=null; msgT=0; heroPose="fall";
  render();
}
function winGame(){
  state="win"; winT=0; clearTimeout(timer); sfxFanfare();
  timer=setTimeout(winLoop,120);
}
function winLoop(){
  clearTimeout(timer);
  timer=setTimeout(function(){ if(state!=="win") return; winT++; blink^=1; render(); winLoop(); },150);
}

/* ================= render ================= */
function render(){
  while(lcd.firstChild) lcd.removeChild(lcd.firstChild);
  if(state==="win"){ renderWin(); return; }

  drawPaths();
  drawTower();
  drawGround();
  drawScore(score);
  digit(24,12,13,20, mode==="A"?"A":"b", true);
  txt(24, 44, 11, Math.floor(score/10)+"F", true, "start");
  drawSkulls();

  for(var i=0;i<objs.length;i++) drawObj(objs[i]);
  drawHero(LANEX[heroLane], state==="over" ? "fall" : heroPose);

  if(state==="attract"){
    rectf(52,116,296,60,false,6);
    txt(200,144,22,"MUSCLE BUILDING",true);
    txt(200,164,12, (blink? "GAME A / GAME B おす" : ""), true);
  }
  if(state==="ready") txt(200,150,30,"READY",true);
  if(state==="over"){
    rectf(64,112,272,72,false,6);
    txt(200,136,22,"GAME OVER",true);
    txt(200,156,11,"ビルが くずれ落ちた…",true);
    txt(200,176,11,"GAME A / GAME B で さいスタート",true);
  }
  if(msg && state==="play"){ txt(200,262,14,msg,true); }
}

function drawPaths(){
  // faint コマ送り grid the materials / obstacles snap along
  for(var l=0;l<3;l++){
    var pp=topPath(l);
    for(var i=0;i<pp.length;i++) disc(pp[i][0], pp[i][1], 2.4, false);
  }
  var sp=sidePath("L",2);   // spans the whole width at SIDE_Y
  for(var k=0;k<sp.length;k++) disc(sp[k][0], sp[k][1], 2.4, false);
  var sr=sidePath("R",0);
  for(var m=0;m<sr.length;m++) disc(sr[m][0], sr[m][1], 2.4, false);
}
function drawGround(){
  // 3-lane platform the hero stands on
  rectf(40,204,320,7,false,2);
  for(var i=0;i<3;i++){ lineC(LANEX[i],211,LANEX[i],222,false,3); disc(LANEX[i],204,3,false); }
}
function drawTower(){
  var x0=352, x1=380, y0=30, y1=250;
  E("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:"none",stroke:col(false),"stroke-width":2,opacity:op(false)});
  var floors=Math.min(100,Math.floor(score/10));
  var segs=25, filled=Math.round(floors/100*segs), sh=(y1-y0)/segs;
  for(var i=0;i<segs;i++){
    var yy=y1-(i+1)*sh+1;
    rectf(x0+2, yy, x1-x0-4, sh-1.6, i<filled);
  }
  if(floors>=100) polyf(x0+","+y0+" "+x1+","+y0+" "+((x0+x1)/2)+","+(y0-14), true);
  txt((x0+x1)/2, y1+12, 8, "TOWER", false);
}
function drawSkulls(){
  for(var i=0;i<3;i++){
    var x=300-i*20, y=44, used=i<miss;
    var flash = used && missFlashT>0 && blink;
    var on = used && !flash;
    // skull: head + eyes + jaw
    disc(x,y,6,on);
    disc(x-2.2,y-1,1.3,!on ? false : true); // eye holes (draw as ghost/void-ish)
    if(used){
      E("circle",{cx:x-2.2,cy:y-1,r:1.4,fill:"#A8BBA2",opacity:.9});
      E("circle",{cx:x+2.2,cy:y-1,r:1.4,fill:"#A8BBA2",opacity:.9});
      rectf(x-3,y+4,6,3,on,1);
    } else {
      ring(x,y,6,false,1.6);
    }
  }
}

function drawObj(o){
  var s=o.path[Math.min(o.si,o.path.length-1)];
  var x=s[0], y=s[1], on=true;
  if(o.dead){
    // brief hit/deflect flourish
    if(o.result==="ok" && o.needPose==="B"){
      for(var a=0;a<6;a++){ var an=a*Math.PI/3; lineC(x,y,x+Math.cos(an)*12,y+Math.sin(an)*12,on,2); }
      return;
    }
    if(o.result==="miss"){
      for(var b=0;b<8;b++){ var bn=b*Math.PI/4; lineC(x+Math.cos(bn)*4,y+Math.sin(bn)*4,x+Math.cos(bn)*13,y+Math.sin(bn)*13,on,2); }
      return;
    }
    return;
  }
  if(o.kind==="beam"){
    rectf(x-11,y-8,22,4,on,1); rectf(x-11,y+4,22,4,on,1); rectf(x-3,y-8,6,16,on,1);
  } else if(o.kind==="cement"){
    rectf(x-9,y-9,18,18,on,3);
    lineC(x-6,y-3,x+6,y-3,on,1.4); lineC(x-6,y+3,x+6,y+3,on,1.4);
  } else if(o.kind==="ball"){
    disc(x,y,8,on);
    // short chain toward its origin edge
    var dir = (o.origin==="L")? -1 : 1;
    lineC(x+dir*8,y,x+dir*16,y-4,on,2.4); lineC(x+dir*16,y-4,x+dir*24,y,on,2.4);
  } else { // bird
    disc(x,y,4,on);
    var f=blink?4:-2;
    paths("M"+(x-11)+","+(y-3+f)+" L"+x+","+y+" L"+(x+11)+","+(y-3+f), on, 2.6);
    // feint marker
    if(o.feint && !o.feinted) txt(x, y-12, 12, "?", on);
  }
}

function drawHero(x, pose){
  var on=true;
  function P(dx,dy){ return (x+dx)+","+(HERO_Y+dy); }
  if(pose==="fall"){
    paths("M"+(x-22)+","+(HERO_Y+22)+" L"+(x+20)+","+(HERO_Y+22), on, 12);
    disc(x-28, HERO_Y+22, 7, on);
    pathf("M"+(x-40)+","+(HERO_Y+14)+" Q"+(x-28)+","+(HERO_Y+2)+" "+(x-16)+","+(HERO_Y+14)+" Z", on);
    return;
  }
  // legs
  paths("M"+P(-7,2)+" L"+P(-9,14), on, 7);
  paths("M"+P(7,2)+" L"+P(9,14), on, 7);
  // torso (broad)
  polyf(P(-14,-20)+" "+P(14,-20)+" "+P(11,4)+" "+P(-11,4), on);
  lineC(x-11,HERO_Y-2,x+11,HERO_Y-2,on,2); // tool belt
  // head + hard hat
  disc(x, HERO_Y-27, 6, on);
  pathf("M"+P(-11,-27)+" Q"+P(0,-42)+" "+P(11,-27)+" Z", on);
  rectf(x-13, HERO_Y-27, 26, 3, on, 1);
  // arms by pose
  if(pose==="A"){
    paths("M"+P(-12,-16)+" L"+P(-9,-40), on, 6);
    paths("M"+P(12,-16)+" L"+P(9,-40), on, 6);
    lineC(x-12,HERO_Y-40,x+12,HERO_Y-40,on,4);   // "caught" bar over hands
  } else if(pose==="B"){
    paths("M"+P(-12,-15)+" L"+P(-26,-15), on, 6.5);
    paths("M"+P(12,-15)+" L"+P(26,-15), on, 6.5);
    disc(x-27,HERO_Y-15,3.5,on); disc(x+27,HERO_Y-15,3.5,on);
  } else {
    paths("M"+P(-12,-15)+" L"+P(-16,-2), on, 6);
    paths("M"+P(12,-15)+" L"+P(16,-2), on, 6);
  }
}

function drawBuff(x,y,s,on,pose){
  function P(dx,dy){ return (x+dx*s)+","+(y+dy*s); }
  paths("M"+P(-6,0)+" L"+P(-7,15), on, 4*s);
  paths("M"+P(6,0)+" L"+P(7,15), on, 4*s);
  polyf(P(-10,-15)+" "+P(10,-15)+" "+P(8,2)+" "+P(-8,2), on);
  disc(x, y-21*s, 4.4*s, on);
  if(pose==="cheer"){ paths("M"+P(-9,-13)+" L"+P(-15,-28), on, 4*s); paths("M"+P(9,-13)+" L"+P(15,-28), on, 4*s); }
  else { paths("M"+P(-9,-12)+" L"+P(-18,-12), on, 4*s); paths("M"+P(9,-12)+" L"+P(18,-12), on, 4*s); }
}

function renderWin(){
  var full=(winT%2===0);
  // full tower lit + spire
  var x0=352,x1=380,y0=30,y1=250,sh=(y1-y0)/25;
  E("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:"none",stroke:col(full),"stroke-width":2,opacity:op(full)});
  for(var i=0;i<25;i++) rectf(x0+2, y1-(i+1)*sh+1, x1-x0-4, sh-1.6, full);
  polyf(x0+","+y0+" "+x1+","+y0+" "+((x0+x1)/2)+","+(y0-16), full);

  drawScore(1000);
  digit(24,12,13,20, mode==="A"?"A":"b", true);
  txt(24,44,11,"100F", true, "start");

  drawHero(LANEX[1], full?"A":"B");
  var xs=[36,84,150,236,300];
  for(var k=0;k<xs.length;k++) drawBuff(xs[k], 236, 0.62, full, (k%2?"cheer":"front"));
  drawBuff(160, 96, 0.8, full, "cheer");
  rectf(52,116,296,46,!full,6);
  txt(200,136,20,"マッスルタワー かんせい！", true);
  txt(200,154,11, full? "100  FLOORS  BUILT !!" : "", true);
  txt(200,272,11,"GAME A / GAME B / RESET", true);
}

/* ================= input ================= */
function wire(el,fn){
  el.addEventListener("touchstart",function(e){ e.preventDefault(); fn(); },{passive:false});
  el.addEventListener("mousedown",function(e){ e.preventDefault(); fn(); });
}
function move(d){
  ac(); sfxTic();
  if(state==="attract"){ newGame("A"); return; }
  if(state!=="play") return;
  heroLane=clamp(heroLane+d,0,2);
  render();
}
function pose(p){
  ac(); sfxTic();
  if(state==="attract"){ newGame("A"); return; }
  if(state==="win"||state==="over"){ attract(); return; }
  if(state!=="play") return;
  heroPose=p; poseT=poseHoldTicks();
  render();
}
wire($("bL"),function(){ move(-1); });
wire($("bR"),function(){ move(1); });
wire($("bA"),function(){ pose("A"); });
wire($("bB"),function(){ pose("B"); });

document.querySelectorAll(".mode[data-act]").forEach(function(btn){
  btn.addEventListener("click",function(){
    ac();
    var a=btn.dataset.act;
    if(a==="a") newGame("A");
    else if(a==="b") newGame("B");
    else if(a==="reset") attract();
  });
});
$("snd").addEventListener("click",function(e){ e.stopPropagation(); soundOn=!soundOn; this.innerHTML="&#9834;&nbsp;"+(soundOn?"ON":"OFF"); });

window.addEventListener("keydown",function(e){
  var k=(e.key||"").toLowerCase();
  if(e.repeat) return;
  if(k==="arrowleft"){ e.preventDefault(); move(-1); }
  else if(k==="arrowright"){ e.preventDefault(); move(1); }
  else if(k==="z"||k==="a"||k==="arrowup"||k===" "){ e.preventDefault(); pose("A"); }
  else if(k==="x"||k==="l"||k==="arrowdown"||k==="enter"){ e.preventDefault(); pose("B"); }
  else if(k==="1"){ newGame("A"); }
  else if(k==="2"){ newGame("B"); }
  else if(k==="r"){ attract(); }
});
document.addEventListener("gesturestart",function(e){ e.preventDefault(); });
document.addEventListener("dblclick",function(e){ e.preventDefault(); },{passive:false});
$("console").addEventListener("contextmenu",function(e){ e.preventDefault(); });

/* ================= fit ================= */
function fit(){
  var c=$("console");
  c.style.transform="scale(1)";
  var r=c.getBoundingClientRect();
  var k=Math.min(window.innerWidth/(r.width+16), window.innerHeight/(r.height+16), 1.5);
  c.style.transform="scale("+k+")";
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){ setTimeout(fit,200); });

/* ================= boot ================= */
attract();
fit();
setTimeout(fit,120);

})();
</script>
