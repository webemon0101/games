<style>

    background:radial-gradient(circle at 50% 24%, #4a4636, #1a1710 74%);

  #console{
    width:376px; transform-origin:center center;
    padding:14px 14px 18px;
    border-radius:30px;
    background:
      linear-gradient(155deg,#ffe680 0%,#f4c740 40%,#d99b1f 72%,#b87d16 100%);
    box-shadow:
      inset 0 3px 5px rgba(255,248,210,.85),
      inset 0 -7px 16px rgba(120,74,0,.4),
      0 20px 42px rgba(0,0,0,.5),
      0 0 0 2px rgba(255,255,255,.18);

  }
  #console::before{
    content:""; position:absolute; inset:7px; border-radius:24px;
    border:1px solid rgba(140,90,0,.35); pointer-events:none;
  }
  .screw{ position:absolute; width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d0, #a9781a);
    box-shadow:inset 0 0 2px rgba(0,0,0,.5); }
  .screw.tl{ top:10px; left:10px; } .screw.tr{ top:10px; right:10px; }
  .screw.bl{ bottom:12px; left:10px; } .screw.br{ bottom:12px; right:10px; }

  .toprow{ display:flex; gap:5px; justify-content:center; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .mode{
    font-family:inherit; font-weight:800; font-size:9.5px; letter-spacing:.3px;
    color:#4a3200; background:linear-gradient(#fff4cf,#ffdf8c);
    border:1px solid #b98a2a; border-radius:16px; padding:5px 9px; cursor:pointer;
    box-shadow:0 2px 0 #9c6f1e, 0 3px 4px rgba(0,0,0,.3);
  }
  .mode.sm{ padding:5px 8px; }
  .mode:active{ transform:translateY(2px); box-shadow:0 0 0 #9c6f1e; }

  .screenwrap{
    padding:11px; border-radius:12px;
    background:linear-gradient(#2b2a20,#4a4636);

  }
  .screen{
    position:relative; width:100%; aspect-ratio:4/3;
    border-radius:6px; overflow:hidden;
    background:
      radial-gradient(130% 100% at 50% 15%, #b8c7b0, #a3b39b 62%, #93a488 100%);

  }
  .screen::after{

    width:66px; height:66px; border-radius:50%;
    font-family:inherit; font-weight:800; color:#3a2600; cursor:pointer;
    border:2px solid #9c6f1e;
    background:radial-gradient(circle at 36% 30%, #fff3c8, #edc45f 60%, #cf9a2c 100%);
    box-shadow:0 5px 0 #96691c, 0 7px 10px rgba(0,0,0,.4), inset 0 2px 5px rgba(255,255,255,.6);
    display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
    touch-action:none;
  }
  .rb .big{ font-size:22px; }
  .rb .lab{ font-size:8px; margin-top:2px; letter-spacing:.5px; }
  .rb.ab{ background:radial-gradient(circle at 36% 30%, #ffd9c8, #f0895f 58%, #c9522c 100%); color:#3a1400; border-color:#a03a1c; box-shadow:0 5px 0 #8f3419, 0 7px 10px rgba(0,0,0,.4), inset 0 2px 5px rgba(255,255,255,.5); }
  .rb:active{ transform:translateY(4px); box-shadow:0 1px 0 #96691c, 0 3px 6px rgba(0,0,0,.4), inset 0 2px 5px rgba(255,255,255,.6); }

<body>
<div id="stage">
  <div id="console">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <div class="toprow">
      <button class="mode" data-act="a">GAME&nbsp;A</button>
      <button class="mode" data-act="b">GAME&nbsp;B</button>
      <button class="mode" data-act="reset">TIME / RESET</button>
      <button class="mode sm" id="snd">&#9834;&nbsp;ON</button>
    </div>

    <div class="screenwrap">
      <div class="screen">
        <svg id="lcd" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

        <button class="rb" id="bL"><span class="big">&#9664;</span><span class="lab">ひだり</span></button>
        <button class="rb" id="bR"><span class="big">&#9654;</span><span class="lab">みぎ</span></button>
      </div>
      <div class="agrp">
        <button class="rb ab" id="bA"><span class="big">A</span><span class="lab">フリップ</span></button>
        <button class="rb ab" id="bB"><span class="big">B</span><span class="lab">ポーズ盛り</span></button>
      </div>
    </div>
    <div class="hint">&larr;&rarr; 移動 ／ A 打ち上げ ／ B きつね色を右台でポーズ盛り付け<br>3回ミスで終了・1000点でエンディング</div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= helpers ================= */
var NS="http://www.w3.org/2000/svg";
var lcd=document.getElementById("lcd");
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function E(tag,a){
  var e=document.createElementNS(NS,tag);
  for(var k in a) e.setAttribute(k,a[k]);
  lcd.appendChild(e);
  return e;
}
// on = lit (dark), else ghost (faint "show-through")
function col(on){ return on ? "#1A1A1A" : "#33402f"; }
function op(on){ return on ? 0.95 : 0.15; }
function disc(x,y,r,on){ E("circle",{cx:x,cy:y,r:r,fill:col(on),opacity:op(on)}); }
function ring(x,y,r,on,w){ E("circle",{cx:x,cy:y,r:r,fill:"none",stroke:col(on),"stroke-width":w||2.4,opacity:op(on)}); }
function rectf(x,y,w,h,on,rx){ E("rect",{x:x,y:y,width:w,height:h,rx:rx||1.5,fill:col(on),opacity:op(on)}); }
function lineC(x1,y1,x2,y2,on,w){ E("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col(on),"stroke-width":w||5,"stroke-linecap":"round",opacity:op(on)}); }
function polyf(pts,on){ E("polygon",{points:pts,fill:col(on),opacity:op(on)}); }
function pathf(d,on){ E("path",{d:d,fill:col(on),opacity:op(on)}); }
function paths(d,on,w){ E("path",{d:d,fill:"none",stroke:col(on),"stroke-width":w||3,"stroke-linecap":"round","stroke-linejoin":"round",opacity:op(on)}); }
function txt(x,y,s,str,on,anchor){ var e=E("text",{x:x,y:y,"font-family":"'Courier New',monospace","font-weight":"bold","font-size":s,fill:col(on),opacity:op(on),"text-anchor":anchor||"middle"}); e.textContent=str; }

/* ================= 7-seg ================= */
var SEG7={
 "0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd",
 "6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg",
 "A":"abcefg","b":"cdefg","-":"g"," ":""
};
function digit(x,y,w,h,ch,litGhost){
  var t=Math.max(2.5,w*0.18), vL=(h-3*t)/2;
  var on=SEG7[ch]||"";
  var def={
    a:[x+t,y,w-2*t,t], f:[x,y+t,t,vL], b:[x+w-t,y+t,t,vL],
    g:[x+t,y+(h-t)/2,w-2*t,t], e:[x,y+(h+t)/2,t,vL], c:[x+w-t,y+(h+t)/2,t,vL],
    d:[x+t,y+h-t,w-2*t,t]
  };
  for(var s in def){
    var r=def[s], lit=on.indexOf(s)>=0;
    var show = litGhost ? true : lit;      // when litGhost, draw ghost for unlit too
    if(show) E("rect",{x:r[0],y:r[1],width:r[2],height:r[3],rx:t*0.4,fill:col(lit),opacity:op(lit)});
  }
}
function drawScore(v){
  var str=(""+Math.min(9999,v)); while(str.length<4) str="0"+str;
  for(var i=0;i<4;i++) digit(150+i*26, 10, 21, 30, str.charAt(i), true);
}

/* ================= geometry ================= */
// pancake path: fine コマ送り stations built by sub-dividing 16 control points.
// control idx 3 = left flip, 9 = centre flip, 15 = right serve  ->  *2 after split.
var LANEX=[95,200,305];
var _CTRL=[
  [95,58],[95,102],[95,146],[95,188],       // fall to LEFT stove   (ctrl 3 = FLIP)
  [132,150],[168,98],                        // arc L->C
  [200,52],[200,98],[200,144],[200,188],     // fall to CENTRE stove (ctrl 9 = FLIP)
  [240,150],[276,98],                        // arc C->R
  [305,58],[305,102],[305,146],[305,186]     // fall to RIGHT counter (ctrl 15 = SERVE)
];
var STN=[];
(function(){
  for(var i=0;i<_CTRL.length;i++){
    STN.push(_CTRL[i]);
    if(i<_CTRL.length-1) STN.push([ (_CTRL[i][0]+_CTRL[i+1][0])/2, (_CTRL[i][1]+_CTRL[i+1][1])/2 ]);
  }
})();
var FLIP_L=6, FLIP_C=18, SERVE_R=30;   // = ctrl 3/9/15 * 2
var CHEF_Y=214;

/* ================= audio ================= */
var actx=null, soundOn=true;
function ac(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} return actx; }
function blip(f,d,type,v,slideTo){
  if(!soundOn) return; var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain(), n=c.currentTime;
    o.type=type||"square"; o.frequency.setValueAtTime(f,n);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), n+d);
    g.gain.setValueAtTime(0.0001,n);
    g.gain.linearRampToValueAtTime(v||0.12,n+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(g); g.connect(c.destination); o.start(n); o.stop(n+d+0.03);
  }catch(e){}
}
function noise(d,v){
  if(!soundOn) return; var c=ac(); if(!c) return;
  try{
    var len=Math.floor(c.sampleRate*d), b=c.createBuffer(1,len,c.sampleRate), dd=b.getChannelData(0);
    for(var i=0;i<len;i++) dd[i]=(Math.random()*2-1)*(1-i/len);
    var s=c.createBufferSource(), g=c.createGain();
    s.buffer=b; g.gain.value=v||0.3; s.connect(g); g.connect(c.destination); s.start();
  }catch(e){}
}
function sfxTic(){ noise(0.02,0.10); }
function sfxTempo(){ blip(1300+tier()*170, 0.028, "square", 0.045); }
function sfxFlip(){ blip(880,0.035,"square",0.13); setTimeout(function(){ blip(1720,0.05,"square",0.11); },28); }
function sfxServe(){ blip(150,0.16,"square",0.2,60); noise(0.13,0.34); }
function sfxWhiff(){ blip(520,0.05,"square",0.06,360); }
function sfxMiss(){ blip(1000,0.5,"sawtooth",0.18,90); setTimeout(function(){ noise(0.15,0.14); },140); }
function sfxRecover(){ [700,1050,1400].forEach(function(f,i){ setTimeout(function(){ blip(f,0.1,"square",0.12); },i*80); }); }
function sfxGameOver(){ [340,270,210,150].forEach(function(f,i){ setTimeout(function(){ blip(f,0.22,"sawtooth",0.14); },i*150); }); }
function sfxFanfare(){ [523,659,784,1047,1319,1047,1319,1568,2093].forEach(function(f,i){ setTimeout(function(){ blip(f,0.14,"square",0.13); },i*95); }); }

/* ================= state ================= */
var mode="A", state="attract";
var score=0, miss=0, servedCount=0;
var chefLane=1, chefPose="idle", chefPoseT=0;
var pancakes=[];
var spawnTimer=0, tickN=0, blink=0, timer=null;
var missFlashT=0, msg=null, msgT=0, recovered200=false;
var flamePhase=0, winT=0;

function tier(){
  var s=score;
  var b=(mode==="B")?1:0;
  var tt = s<100?0 : s<200?1 : s<400?2 : s<700?3 : 4;
  return Math.min(4, tt+b);
}
function intervalMs(){
  return [480,390,300,210,135][tier()];
}
function maxPancakes(){
  var m=[1,2,2,3,3][tier()];
  if(tier()===2 && score>=300) m=3;
  if(mode==="B") m=Math.min(3,m+1);
  return m;
}
function flipGrace(){ return tier()<=1 ? 2 : 1; }
function serveGrace(){ return tier()<=1 ? 3 : (tier()===2 ? 2 : 1); }
var SPAWN_GAP=11;

/* ================= flow ================= */
function setMsg(s){ msg=s; msgT=8; }

function attract(){
  clearTimeout(timer);
  state="attract"; mode="A"; score=0; miss=0; servedCount=0;
  chefLane=1; chefPose="idle"; chefPoseT=0; recovered200=false; winT=0;
  pancakes=[{i:1,cook:0,wait:0,dropping:false}];
  render();
  demoLoop();
}
function demoLoop(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(state!=="attract") return;
    tickN++; flamePhase^=1; blink^=1;
    var p=pancakes[0];
    p.i=(p.i+1)%STN.length;
    if(p.i===FLIP_L||p.i===FLIP_C){ chefLane=(p.i===FLIP_L)?0:1; chefPose="flip"; chefPoseT=2; }
    else if(p.i===SERVE_R){ chefLane=2; chefPose="serve"; chefPoseT=2; }
    else if(chefPoseT<=0) chefPose="idle";
    if(chefPoseT>0) chefPoseT--;
    render();
    demoLoop();
  }, 250);
}

function newGame(m){
  ac();
  clearTimeout(timer);
  mode=m; state="ready"; score=0; miss=0; servedCount=0;
  chefLane=1; chefPose="idle"; chefPoseT=0; recovered200=false; winT=0;
  pancakes=[]; spawnTimer=0; tickN=0; missFlashT=0; msg="READY"; msgT=99;
  render();
  var rc=0;
  var rd=function(){
    blip(760,0.07,"square",0.1); rc++;
    if(rc>=3){ msg=null; state="play"; render(); loop(); }
    else timer=setTimeout(rd,400);
  };
  timer=setTimeout(rd,420);
}

function loop(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(state!=="play") return;
    tickN++; flamePhase^=1; blink^=1;
    if(missFlashT>0) missFlashT--;
    if(chefPoseT>0){ chefPoseT--; if(chefPoseT<=0) chefPose="idle"; }
    if(msgT>0){ msgT--; if(msgT<=0) msg=null; }
    step();
    if(state==="play"){ if(tickN%2===0) sfxTempo(); render(); loop(); }
    else render();
  }, intervalMs());
}

function judgeServe(p){ return p.cook<2 ? "raw" : (p.cook>2 ? "burnt" : "ok"); }

function doMiss(kind){
  miss++;
  missFlashT=6;
  sfxMiss();
  setMsg({drop:"おとした！",raw:"なまやき！",burnt:"こげた！"}[kind] || "ミス！");
  if(miss>=3) gameOver();
}

function step(){
  // spawn
  if(spawnTimer>0) spawnTimer--;
  if(spawnTimer<=0 && pancakes.length<maxPancakes()){
    pancakes.push({i:0,cook:0,wait:0,dropping:false});
    spawnTimer=SPAWN_GAP;
  }
  var keep=[];
  for(var k=0;k<pancakes.length;k++){
    var p=pancakes[k];
    if(p.dropping){ p.dt=(p.dt||0)+1; if(p.dt<2) keep.push(p); continue; }
    if(p.i===FLIP_L || p.i===FLIP_C || p.i===SERVE_R){
      p.wait++;
      var gr=(p.i===SERVE_R)?serveGrace():flipGrace();
      if(p.wait>gr+1){
        p.dropping=true; p.dt=0;
        doMiss(p.i===SERVE_R ? "drop" : "drop");
        keep.push(p);
      } else {
        keep.push(p);   // sit at station, waiting for input
      }
      continue;
    }
    p.i++;
    if(p.i>SERVE_R){ continue; }   // exited (served handled on B)
    keep.push(p);
  }
  pancakes=keep;

  checkEvents();
}

function checkEvents(){
  if(!recovered200 && score>=200){
    recovered200=true;
    if(miss>0){ miss--; setMsg("ミス かいふく！"); sfxRecover(); }
  }
  if(score>=1000 && state==="play"){ winGame(); }
}

function findAt(lane, stations){
  for(var k=0;k<pancakes.length;k++){
    var p=pancakes[k];
    if(p.dropping) continue;
    for(var j=0;j<stations.length;j++) if(p.i===stations[j]) return p;
  }
  return null;
}

function pressA(){
  ac(); sfxTic();
  if(state==="attract"){ newGame("A"); return; }
  if(state!=="play") return;
  if(chefLane===2){ sfxWhiff(); return; }   // A only on stoves
  var st = (chefLane===0)? FLIP_L : FLIP_C;
  var p = findAt(chefLane,[st]);
  var early=false;
  if(!p && tier()>=1){ p=findAt(chefLane,[st-1,st-2]); early=true; }   // early window
  if(!p){ sfxWhiff(); setMsg("？"); return; }
  p.wait=0;
  p.i = st+1;                 // launched into the arc
  if(early && tier()>=2){
    // 早すぎ = 生焼きフリップ（火が入らない）
    score+=5;
    sfxWhiff();
    setMsg("はやい！");
  } else {
    p.cook=Math.min(3,p.cook+1);
    score+=10;
    chefPose="flip"; chefPoseT=2;
    sfxFlip();
    setMsg("フリップ +10");
  }
  checkEvents();
}

function pressB(){
  ac(); sfxTic();
  if(state==="attract"){ newGame("A"); return; }
  if(state==="win"||state==="over"){ attract(); return; }
  if(state!=="play") return;
  if(chefLane!==2){ sfxWhiff(); setMsg("右台で！"); return; }
  var p=findAt(2,[SERVE_R]);
  if(!p){
    var early=findAt(2,[SERVE_R-1,SERVE_R-2]);
    if(early && tier()>=3){
      early.cook=Math.min(3,early.cook+1);   // 焼きすぎ = 焦げる
      early.wait=0;
      sfxWhiff(); setMsg("はやい！ こげる…");
    } else {
      sfxWhiff(); setMsg("？");
    }
    return;
  }
  var j=judgeServe(p);
  p.dropping=true; p.dt=1;   // remove next tick
  p.i=SERVE_R+1;
  if(j==="ok"){
    score+=20; servedCount++;
    chefPose="serve"; chefPoseT=3;
    sfxServe();
    setMsg("ポーズ盛り！ +20");
  } else {
    doMiss(j);
  }
  checkEvents();
}

function moveChef(d){
  ac(); sfxTic();
  if(state==="attract"){ newGame("A"); return; }
  if(state!=="play") return;
  chefLane=clamp(chefLane+d,0,2);
  render();
}

function gameOver(){
  state="over";
  clearTimeout(timer);
  sfxGameOver();
  setMsg(null); msgT=0;
  chefPose="fall";
  render();
}
function winGame(){
  state="win"; winT=0;
  clearTimeout(timer);
  sfxFanfare();
  timer=setTimeout(winLoop,120);
}
function winLoop(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(state!=="win") return;
    winT++; blink^=1;
    render();
    winLoop();
  },150);
}

/* ================= render ================= */
function render(){
  while(lcd.firstChild) lcd.removeChild(lcd.firstChild);

  if(state==="win"){ renderWin(); return; }

  // --- always-on-ish backdrop pieces (ghosts) ---
  // path station ghosts
  for(var i=0;i<STN.length;i++) disc(STN[i][0],STN[i][1],3,false);
  // stoves (left + center)
  drawStove(LANEX[0]);
  drawStove(LANEX[1]);
  // right serving counter + plate + waiting customer
  drawCounter();
  // waiting muscle customers (left edge)
  drawWaiting();

  // --- HUD ---
  drawScore(score);
  digit(24,12,13,20, mode==="A"?"A":"b", true);
  drawMissMarks();

  // --- pancakes ---
  for(var p=0;p<pancakes.length;p++) drawPancake(pancakes[p]);

  // --- chef ---
  drawChef(LANEX[chefLane], state==="over" ? "fall" : chefPose);

  // --- overlays ---
  if(state==="attract"){
    rectf(60,120,280,60,false,6);
    txt(200,150,26,"MUSCLE KITCHEN",true);
    txt(200,172,12, (blink? "GAME A / GAME B おす" : ""), true);
  }
  if(state==="ready"){
    txt(200,150,30,"READY",true);
  }
  if(state==="over"){
    rectf(70,116,260,64,false,6);
    txt(200,142,22,"GAME OVER",true);
    txt(200,164,12,"きゃくが おこって かえった…",true);
    txt(200,196,11,"GAME A / GAME B で さいスタート",true);
  }
  if(msg && state!=="over"){
    txt(200, 250, 15, msg, true);
  }
}

function drawStove(x){
  // burner box
  rectf(x-22, 244, 44, 14, false, 2);
  // flames (flicker between two ghost shapes)
  var f=flamePhase;
  pathf("M"+(x-12)+","+244+" Q"+(x-6)+","+(228+f*4)+" "+x+","+244+" Q"+(x+6)+","+(230-f*4)+" "+(x+12)+","+244+" Z", false);
  pathf("M"+(x-6)+","+244+" Q"+x+","+(222+f*6)+" "+(x+6)+","+244+" Z", false);
}
function drawCounter(){
  var x=LANEX[2];
  rectf(x-26, 236, 52, 10, false, 2);        // counter top
  E("ellipse",{cx:x,cy:232,rx:20,ry:5,fill:col(false),opacity:op(false)});  // plate
  // waiting customer behind the counter (buff, ghost)
  buff(x+16, 214, 0.62, false, "front");
}
function drawWaiting(){
  buff(24, 210, 0.6, false, "side");
  buff(48, 214, 0.55, false, "side");
  buff(20, 250, 0.62, false, "front");
}
function drawMissMarks(){
  for(var i=0;i<3;i++){
    var x=322+i*24, y=20, used=i<miss;
    var flash = used && missFlashT>0 && blink;
    var on = used && !flash;
    // burnt pan icon: circle + handle
    ring(x,y,7,on,2.2);
    lineC(x+6,y-4,x+16,y-9,on,3);
    if(used){
      // burnt fill hatch
      lineC(x-4,y-3,x+4,y+3,on,1.6);
      lineC(x-4,y+3,x+4,y-3,on,1.6);
    }
  }
}

function drawPancake(p){
  var x,y;
  if(p.dropping){ x=STN[Math.min(p.i,15)][0]; y=252; }
  else { var s=STN[Math.min(p.i,15)]; x=s[0]; y=s[1]; }
  var on=true;
  // body
  if(p.cook>=2 && p.cook<=2){ disc(x,y,8,on); }              // golden = filled
  else if(p.cook>=3){                                        // burnt = spiky filled
    disc(x,y,8,on);
    for(var a=0;a<8;a++){ var an=a*Math.PI/4; lineC(x+Math.cos(an)*7,y+Math.sin(an)*7,x+Math.cos(an)*12,y+Math.sin(an)*12,on,1.8); }
  }
  else if(p.cook===1){ ring(x,y,8,on,3); disc(x,y,3,on); }   // half
  else { ring(x,y,8,on,2.6); }                               // raw
  // sizzle marks for golden
  if(p.cook===2){
    for(var b=0;b<4;b++){ var bn=b*Math.PI/2+0.4; lineC(x+Math.cos(bn)*10,y+Math.sin(bn)*10,x+Math.cos(bn)*14,y+Math.sin(bn)*14,on,1.6); }
  }
}

/* buff figure (customers). pose: front | side | cheer */
function buff(x,y,s,on,pose){
  function P(dx,dy){ return (x+dx*s)+","+(y+dy*s); }
  // legs
  paths("M"+P(-6,0)+" L"+P(-7,16), on, 4*s);
  paths("M"+P(6,0)+" L"+P(7,16), on, 4*s);
  // torso
  polyf(P(-11,-16)+" "+P(11,-16)+" "+P(8,2)+" "+P(-8,2), on);
  // head
  disc(x, y-22*s, 4.6*s, on);
  // arms
  if(pose==="cheer"){
    paths("M"+P(-10,-14)+" L"+P(-16,-30), on, 4*s);
    paths("M"+P(10,-14)+" L"+P(16,-30), on, 4*s);
  } else if(pose==="side"){
    paths("M"+P(-10,-13)+" L"+P(-20,-13), on, 4*s);
    paths("M"+P(10,-13)+" L"+P(20,-13), on, 4*s);
  } else {
    paths("M"+P(-10,-13)+" L"+P(-15,-4)+" L"+P(-7,-14), on, 4*s);
    paths("M"+P(10,-13)+" L"+P(15,-4)+" L"+P(7,-14), on, 4*s);
  }
}

/* chef 大介 */
function drawChef(x, pose){
  var on=true;
  function P(dx,dy){ return (x+dx)+","+(CHEF_Y+dy); }
  if(pose==="fall"){
    // collapsed on the floor, pan dropped
    paths("M"+(x-24)+","+(CHEF_Y+30)+" L"+(x+20)+","+(CHEF_Y+30), on, 12);   // body lying
    disc(x-30, CHEF_Y+30, 8, on);                                            // head
    polyf((x-46)+","+(CHEF_Y+18)+" "+(x-30)+","+(CHEF_Y+12)+" "+(x-26)+","+(CHEF_Y+22), on); // toppled hat
    ring(x+34, CHEF_Y+30, 9, on, 3); lineC(x+42,CHEF_Y+26,x+54,CHEF_Y+20,on,3); // dropped pan
    return;
  }
  // legs
  paths("M"+P(-8,4)+" L"+P(-10,26), on, 7);
  paths("M"+P(8,4)+" L"+P(10,26), on, 7);
  // apron / torso (big)
  polyf(P(-16,-24)+" "+P(16,-24)+" "+P(13,6)+" "+P(-13,6), on);
  // waist tie
  lineC(x-13,CHEF_Y-2,x+13,CHEF_Y-2,on,2.4);
  // head + tall chef hat
  disc(x, CHEF_Y-30, 6.5, on);
  polyf(P(-9,-36)+" "+P(9,-36)+" "+P(11,-52)+" "+P(-11,-52), on);
  E("ellipse",{cx:x,cy:CHEF_Y-53,rx:12,ry:5,fill:col(on),opacity:op(on)});
  // arms + frying pan by pose
  if(pose==="flip"){
    paths("M"+P(-13,-20)+" L"+P(-6,-44), on, 6);
    paths("M"+P(13,-20)+" L"+P(6,-44), on, 6);
    E("ellipse",{cx:x,cy:CHEF_Y-46,rx:17,ry:5,fill:col(on),opacity:op(on)});
    lineC(x+15,CHEF_Y-46,x+30,CHEF_Y-40,on,4);
  } else if(pose==="serve"){
    // one arm slammed down with pan, other flexed (bicep)
    paths("M"+P(13,-20)+" L"+P(26,-6)+" L"+P(30,-18), on, 6);
    E("ellipse",{cx:x+30,cy:CHEF_Y-18,rx:14,ry:4.5,fill:col(on),opacity:op(on)});
    paths("M"+P(-13,-20)+" L"+P(-22,-30)+" L"+P(-10,-34), on, 6);
    disc(x-10, CHEF_Y-34, 4, on);   // flexed fist
  } else {
    // idle: pan held forward
    paths("M"+P(-13,-18)+" L"+P(-18,-6), on, 6);
    paths("M"+P(13,-18)+" L"+P(24,-24), on, 6);
    E("ellipse",{cx:x+30,cy:CHEF_Y-26,rx:14,ry:4.5,fill:col(on),opacity:op(on)});
    lineC(x+16,CHEF_Y-24,x+24,CHEF_Y-24,on,4);
  }
}

function renderWin(){
  // LCD 全点灯風：全部濃く点滅
  var full = (winT%2===0);
  // path + stoves + counter all lit
  for(var i=0;i<STN.length;i++) disc(STN[i][0],STN[i][1],3,full);
  drawScore(1000);
  digit(24,12,13,20, mode==="A"?"A":"b", true);
  // big celebration: chef center + buff crowd all posing
  drawChef(LANEX[1], full? "serve":"flip");
  var xs=[36,84,150,252,312,362];
  for(var k=0;k<xs.length;k++) buff(xs[k], 244, 0.66, full, (k%2? "cheer":"front"));
  buff(200, 96, 0.8, full, "cheer");
  rectf(56,120,288,46,!full,6);
  txt(200,140,20,"まんぷく！ 1000てん", true);
  txt(200,158,11, full? "MUSCLES  ARE  FULL !!" : "", true);
  txt(200, 268, 11, "GAME A / GAME B / RESET", true);
}

/* ================= input ================= */
function wire(el,fn){
  el.addEventListener("touchstart",function(e){ e.preventDefault(); fn(); },{passive:false});
  el.addEventListener("mousedown",function(e){ e.preventDefault(); fn(); });
}
wire($("bL"),function(){ moveChef(-1); });
wire($("bR"),function(){ moveChef(1); });
wire($("bA"),pressA);
wire($("bB"),pressB);

document.querySelectorAll(".mode[data-act]").forEach(function(btn){
  btn.addEventListener("click",function(){
    ac();
    var a=btn.dataset.act;
    if(a==="a") newGame("A");
    else if(a==="b") newGame("B");
    else if(a==="reset") attract();
  });
});
$("snd").addEventListener("click",function(e){ e.stopPropagation(); soundOn=!soundOn; this.innerHTML="&#9834;&nbsp;"+(soundOn?"ON":"OFF"); });

window.addEventListener("keydown",function(e){
  var k=(e.key||"").toLowerCase();
  if(e.repeat) return;
  if(k==="arrowleft"){ e.preventDefault(); moveChef(-1); }
  else if(k==="arrowright"){ e.preventDefault(); moveChef(1); }
  else if(k==="z"||k==="a"||k===" "){ e.preventDefault(); pressA(); }
  else if(k==="x"||k==="l"||k==="enter"){ e.preventDefault(); pressB(); }
  else if(k==="1"){ newGame("A"); }
  else if(k==="2"){ newGame("B"); }
  else if(k==="r"){ attract(); }
});
document.addEventListener("gesturestart",function(e){ e.preventDefault(); });
document.addEventListener("dblclick",function(e){ e.preventDefault(); },{passive:false});
$("console").addEventListener("contextmenu",function(e){ e.preventDefault(); });

/* ================= fit ================= */
function fit(){
  var c=$("console");
  c.style.transform="scale(1)";
  var r=c.getBoundingClientRect();
  var k=Math.min(window.innerWidth/(r.width+16), window.innerHeight/(r.height+16), 1.5);
  c.style.transform="scale("+k+")";
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){ setTimeout(fit,200); });

/* ================= boot ================= */
attract();
fit();
setTimeout(fit,120);

})();
</script>
