<style>

<body>
<div id="stage">
  <div id="console">
    <div class="topbar">

      &larr; / A ＝ 左手を移動（3か所を循環）　&rarr; / D ＝ 右手<br>

    </div>

<script>
(function(){
"use strict";

/* ============ helpers ============ */
var NS="http://www.w3.org/2000/svg";
var lcd=document.getElementById("lcd");
function mk(tag,attrs,parent){
  var e=document.createElementNS(NS,tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  (parent||lcd).appendChild(e);
  return e;
}
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function pick(){ return Math.floor(Math.random()*3); }

/* ============ geometry ============
   A fountain loop of 24 steps.  A ball rides it (index +1 / tick):
     0..2  rise on the left (shared)      12..14 rise on the right (shared)
     3..5  over the top (outer)           15..17 over the top (inner)
     6..11 fall to the RIGHT hand         18..23 fall to the LEFT hand
   The fall is one of 3 LANES -- the ball visibly commits to a lane over 6
   dots; the matching hand (0/1/2) must be there when it lands.
   Catch check: idx 11 (right), idx 23 (left).  1 drop = 1 miss, 3 = over.
*/
var LOOP=24;
var LSPOT=[[120,206],[148,206],[176,206]];
var RSPOT=[[224,206],[252,206],[280,206]];

var RISEL=[[146,178],[136,140],[146,98]];
var TOPO =[[172,62],[200,52],[228,62]];
var RISER=[[254,178],[264,140],[254,98]];
var TOPI =[[228,68],[200,58],[172,68]];

var FALLR=[
  [[236,84],[231,110],[227,136],[225,160],[224,183],[224,206]],
  [[250,84],[252,110],[252,136],[252,160],[252,183],[252,206]],
  [[266,84],[272,110],[276,136],[278,160],[280,183],[280,206]]
];
var FALLL=[
  [[164,84],[152,110],[142,136],[132,160],[124,183],[120,206]],
  [[158,84],[154,110],[151,136],[149,160],[148,183],[148,206]],
  [[168,84],[172,110],[174,136],[175,160],[176,183],[176,206]]
];
var DECORX=[
  [200,86],[200,116],[200,146],[185,100],[215,100],
  [182,128],[218,128],[190,158],[210,158]
];

var SHL=[184,214], SHR=[216,214];
var GY=252;

function ballXY(b){
  var i=b.i;
  if(i<3)  return RISEL[i];
  if(i<6)  return TOPO[i-3];
  if(i<12) return FALLR[b.rlane][i-6];
  if(i<15) return RISER[i-12];
  if(i<18) return TOPI[i-15];
  return FALLL[b.llane][i-18];
}

/* ============ 7-seg ============ */
var SEG7={
 "0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd",
 "6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg",
 "A":"abcefg","b":"cdefg","-":"g"," ":""
};
function digitAt(x,y,w,h){
  var tk=Math.max(3,Math.round(w*0.19));
  var vL=(h-3*tk)/2;
  var d={
    a:[x+tk,   y,          w-2*tk, tk],
    f:[x,      y+tk,       tk,     vL],
    b:[x+w-tk, y+tk,       tk,     vL],
    g:[x+tk,   y+(h-tk)/2, w-2*tk, tk],
    e:[x,      y+(h+tk)/2, tk,     vL],
    c:[x+w-tk, y+(h+tk)/2, tk,     vL],
    d:[x+tk,   y+h-tk,     w-2*tk, tk]
  };
  var o={};
  for(var s in d){
    var a=d[s];
    o[s]=mk("rect",{x:a[0],y:a[1],width:a[2],height:a[3],rx:Math.min(a[2],a[3])*0.4,"class":"sg"});
  }
  return o;
}
function setSeg(o,ch){
  var on=SEG7[ch]||"";
  for(var s in o) o[s].classList.toggle("on", on.indexOf(s)>=0);
}

/* ============ build the LCD ============ */
var armLE=[], armRE=[], handLE=[], handRE=[], ballEls=[], trailEls=[];
var scoreDigits=[], modeGlyph, pipEls=[], crushEl={}, legEls={}, footEls={};
var FALLR_EL=[], FALLL_EL=[], allFallEls=[];

function ghost(p){ return mk("circle",{cx:p[0],cy:p[1],r:3,"class":"stn"}); }
function armPath(s,p){
  var my=Math.max(s[1],p[1])+7;
  return "M"+s[0]+","+s[1]+" Q"+((s[0]+p[0])/2)+","+my+" "+p[0]+","+p[1];
}

function buildJuggler(){
  mk("polygon",{points:"200,176 190,198 210,198","class":"cl"});   // hat
  mk("circle",{cx:200,cy:175,r:2.5,"class":"cl"});                 // pom-pom
  mk("circle",{cx:200,cy:203,r:8,"class":"cs"});                   // head
  mk("circle",{cx:197,cy:202,r:1.4,"class":"cl"});
  mk("circle",{cx:203,cy:202,r:1.4,"class":"cl"});
  mk("path",{d:"M197,206 Q200,209 203,206","class":"cs"});
  mk("polygon",{points:"189,211 211,211 216,250 184,250","class":"cl"}); // body
  mk("circle",{cx:200,cy:222,r:1.5,"class":"stn"});
  mk("circle",{cx:200,cy:233,r:1.5,"class":"stn"});
  legEls.L=mk("rect",{x:191,y:250,width:5,height:16,rx:2,"class":"cl"});
  legEls.R=mk("rect",{x:204,y:250,width:5,height:16,rx:2,"class":"cl"});
  footEls.L=mk("ellipse",{cx:190,cy:267,rx:7,ry:3,"class":"cl"});
  footEls.R=mk("ellipse",{cx:210,cy:267,rx:7,ry:3,"class":"cl"});
  mk("rect",{x:44,y:272,width:312,height:2,"class":"stn"});
}

function buildCrush(side){
  var g={}, cx=(side==="L")?138:262, cy=GY;
  g.txt=mk("text",{x:(side==="L")?60:250,y:GY-14,"class":"crush"});
  g.txt.textContent="CRUSH!";
  g.lines=[];
  for(var a=0;a<8;a++){
    var ang=a*Math.PI/4;
    g.lines.push(mk("line",{
      x1:cx+Math.cos(ang)*5, y1:cy+Math.sin(ang)*5,
      x2:cx+Math.cos(ang)*13, y2:cy+Math.sin(ang)*13, "class":"burst"}));
  }
  return g;
}

function build(){
  while(lcd.firstChild) lcd.removeChild(lcd.firstChild);

  DECORX.forEach(ghost);
  RISEL.forEach(ghost); TOPO.forEach(ghost); RISER.forEach(ghost); TOPI.forEach(ghost);
  for(var L=0;L<3;L++){
    FALLR_EL[L]=FALLR[L].map(ghost);
    FALLL_EL[L]=FALLL[L].map(ghost);
    allFallEls=allFallEls.concat(FALLR_EL[L], FALLL_EL[L]);
  }

  buildJuggler();

  for(var h=0;h<3;h++){
    armLE[h]=mk("path",{d:armPath(SHL,LSPOT[h]),"class":"arm"});
    handLE[h]=mk("circle",{cx:LSPOT[h][0],cy:LSPOT[h][1],r:5,"class":"hand"});
    armRE[h]=mk("path",{d:armPath(SHR,RSPOT[h]),"class":"arm"});
    handRE[h]=mk("circle",{cx:RSPOT[h][0],cy:RSPOT[h][1],r:5,"class":"hand"});
  }

  for(var b=0;b<3;b++){
    trailEls[b]=mk("circle",{cx:-20,cy:-20,r:8,"class":"trail"});
    ballEls[b]=mk("circle",{cx:-20,cy:-20,r:8,"class":"ball"});
  }

  for(var i=0;i<4;i++) scoreDigits[i]=digitAt(288+i*25, 12, 21, 32);
  modeGlyph=digitAt(22,14,13,20);
  for(var p=0;p<3;p++) pipEls[p]=mk("circle",{cx:46+p*11,cy:22,r:3.5,"class":"sg"});

  crushEl.L=buildCrush("L");
  crushEl.R=buildCrush("R");
}

/* ============ audio ============ */
var actx=null, soundOn=true;
function resumeAudio(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
  }catch(e){}
}
function blip(freq,dur,type,vol){
  if(!soundOn||!actx) return;
  try{
    var c=actx, t0=c.currentTime;
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol||0.08,t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function beepTick(){
  var iv=interval();
  var f=1120+(SLOW-iv)/(SLOW-120)*980;
  blip(f,0.04,"square",0.06);
}
function beepCatch(){ blip(2093,0.05,"square",0.12); setTimeout(function(){ blip(2794,0.05,"square",0.10); },36); }
function beepCrush(){ blip(150,0.5,"sawtooth",0.22); setTimeout(function(){ blip(96,0.6,"square",0.16); },70); }

/* ============ state ============ */
var SLOW=640, FAST=150;
var mode="A", state="attract", score=0, miss=0;
var hi={A:0,B:0};
try{ hi.A=parseInt(localStorage.getItem("jpop_hi_A"))||0; hi.B=parseInt(localStorage.getItem("jpop_hi_B"))||0; }catch(e){}
var balls=[], leftHand=1, rightHand=1;
var tickCount=0, reliefTicks=0, footTick=0, footSide="R", timer=null;

function interval(){
  if(state==="attract") return 300;
  var lo=(mode==="B")?50:5;
  if(score<=lo) return SLOW;
  var maxr=(mode==="B")?2800:280;
  var p=Math.min(score/maxr,1);
  var e=p*p*(3-2*p);
  var v=SLOW-(SLOW-FAST)*e;
  if(reliefTicks>0) v+=150;
  return clamp(v,FAST,SLOW);
}

/* ============ overlay ============ */
var ovEl=$("ov"), ovTitle=$("ovTitle"), ovMsg=$("ovMsg"), shareBtn=$("shareBtn");
function ov(title,msg){ ovTitle.textContent=title; ovMsg.textContent=msg; ovEl.classList.remove("hide"); shareBtn.hidden=true; }
function hideOv(){ ovEl.classList.add("hide"); }

/* ============ X score share ============ */
var GAME_URL="https://webemon0101.github.io/games/juggle-pop/";
function rankTitle(){
  var n = (mode==="B") ? Math.floor(score/10) : score;   // ~ number of catches
  if(n>=150) return "伝説のジャグルマスター";
  if(n>=50)  return "サーカスの花形";
  if(n>=15)  return "ストリートの芸人";
  return "かけだしジャグラー";
}
function shareURL(){
  var text="JUGGLE POP (GAME "+mode+")\nスコア "+score+" ／ 称号「"+rankTitle()+"」";
  return "https://twitter.com/intent/tweet"
    + "?text=" + encodeURIComponent(text)
    + "&url="  + encodeURIComponent(GAME_URL)
    + "&hashtags=" + encodeURIComponent("ジャグルポップ,レトロゲーム");
}
shareBtn.addEventListener("click",function(e){
  e.stopPropagation();
  window.open(shareURL(), "_blank", "noopener");
});

function showCrush(side){
  var g=crushEl[side];
  g.txt.classList.add("on");
  g.lines.forEach(function(l){ l.classList.add("on"); });
}
function hideCrush(){
  ["L","R"].forEach(function(s){
    crushEl[s].txt.classList.remove("on");
    crushEl[s].lines.forEach(function(l){ l.classList.remove("on"); });
  });
}

/* ============ flow ============ */
function attract(){
  clearTimeout(timer);
  mode="A"; state="attract"; score=0; miss=0; reliefTicks=0; footTick=0; tickCount=0;
  leftHand=1; rightHand=1;
  balls=[
    {i:0, rlane:pick(), llane:pick(), dropped:false},
    {i:12,rlane:pick(), llane:pick(), dropped:false}
  ];
  hideCrush();
  ov("JUGGLE POP","▶  GAME A  /  GAME B\n( キー 1 / 2 でも開始 )");
  render();
  demoLoop();
}
function demoLoop(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(state!=="attract") return;
    tickCount++;
    balls.forEach(function(b){
      b.i=(b.i+1)%LOOP;
      if(b.i===6) b.rlane=pick();
      if(b.i===18) b.llane=pick();
      if(b.i>=6 && b.i<12) rightHand=b.rlane;
      if(b.i>=18 && b.i<24) leftHand=b.llane;
    });
    render();
    demoLoop();
  }, 300);
}

function newGame(m){
  resumeAudio();
  clearTimeout(timer);
  mode=m; state="ready"; score=0; miss=0; reliefTicks=0; footTick=0; tickCount=0;
  leftHand=1; rightHand=1;
  var n=(m==="A")?2:3, off=(m==="A")?12:8;
  balls=[];
  for(var k=0;k<n;k++) balls.push({ i:(k*off)%LOOP, rlane:pick(), llane:pick(), dropped:false });
  hideCrush();
  ov("READY","");
  render();
  var rc=0;
  var rd=function(){
    blip(880,0.07,"square",0.09); rc++;
    if(rc>=3){ hideOv(); state="play"; render(); loop(); }
    else timer=setTimeout(rd,380);
  };
  timer=setTimeout(rd,380);
}

function loop(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(state!=="play") return;
    tickCount++;
    if(reliefTicks>0) reliefTicks--;
    if(footTick>0) footTick--;
    step();
    if(state==="play"){ beepTick(); render(); loop(); }
    else render();
  }, interval());
}

function step(){
  for(var k=0;k<balls.length;k++){
    var b=balls[k];
    if(b.dropped) continue;
    b.i=(b.i+1)%LOOP;
    if(b.i===6)  b.rlane=pick();
    else if(b.i===18) b.llane=pick();
    else if(b.i===11){
      if(rightHand===b.rlane) doCatch();
      else return doDrop(b,"R");
    }else if(b.i===23){
      if(leftHand===b.llane) doCatch();
      else return doDrop(b,"L");
    }
  }
}

function doCatch(){
  if(mode==="B") score=(score+10>9990)?0:score+10;
  else           score=(score+1>9999)?0:score+1;
  if(score>0 && score%100===0) reliefTicks=5;
  beepCatch();
}

function doDrop(b,side){
  b.dropped=true; b.side=side;
  miss++;
  showCrush(side);
  beepCrush();
  state="stumble";
  clearTimeout(timer);
  render();
  if(miss>=3) timer=setTimeout(gameOver,950);
  else        timer=setTimeout(recover,950);
}
function recover(){
  hideCrush();
  for(var k=0;k<balls.length;k++){
    var b=balls[k];
    if(b.dropped){
      b.dropped=false;
      b.i=(b.side==="R")?12:0;
      b.rlane=pick(); b.llane=pick();
    }
  }
  state="play"; render(); loop();
}
function gameOver(){
  state="over";
  if(score>hi[mode]){
    hi[mode]=score;
    try{ localStorage.setItem("jpop_hi_"+mode,String(score)); }catch(e){}
  }
  ov("GAME OVER","称号「"+rankTitle()+"」\nSCORE  "+pad4(score)+"    HI  "+pad4(hi[mode])+"\n▶  GAME A  /  GAME B");
  shareBtn.hidden=false;
  render();
}

/* ============ render ============ */
function pad4(v){ var s=""+v; while(s.length<4) s="0"+s; return s; }

function render(){
  var s=pad4(score);
  for(var i=0;i<4;i++) setSeg(scoreDigits[i], s.charAt(i));
  setSeg(modeGlyph, mode==="A"?"A":"b");
  for(var p=0;p<3;p++) pipEls[p].classList.toggle("on", p<miss);

  for(var f=0;f<allFallEls.length;f++) allFallEls[f].classList.remove("lead");

  var fast=interval()<220;
  for(var k=0;k<ballEls.length;k++){
    var b=balls[k];
    if(!b){ ballEls[k].classList.remove("on"); trailEls[k].classList.remove("on"); continue; }
    var xy;
    if(b.dropped){
      var sp=(b.side==="L")?LSPOT[b.llane]:RSPOT[b.rlane];
      xy=[sp[0], GY];
    }else xy=ballXY(b);
    ballEls[k].setAttribute("cx",xy[0]); ballEls[k].setAttribute("cy",xy[1]);
    ballEls[k].classList.add("on");

    if(!b.dropped && fast){
      var tp=ballXY({i:(b.i+LOOP-1)%LOOP, rlane:b.rlane, llane:b.llane});
      trailEls[k].setAttribute("cx",tp[0]); trailEls[k].setAttribute("cy",tp[1]);
      trailEls[k].classList.add("on");
    }else trailEls[k].classList.remove("on");

    if(!b.dropped){
      if(b.i>=6 && b.i<11){
        var r0=b.i-6;
        if(FALLR_EL[b.rlane][r0+1]) FALLR_EL[b.rlane][r0+1].classList.add("lead");
        if(FALLR_EL[b.rlane][r0+2]) FALLR_EL[b.rlane][r0+2].classList.add("lead");
      }else if(b.i>=18 && b.i<23){
        var l0=b.i-18;
        if(FALLL_EL[b.llane][l0+1]) FALLL_EL[b.llane][l0+1].classList.add("lead");
        if(FALLL_EL[b.llane][l0+2]) FALLL_EL[b.llane][l0+2].classList.add("lead");
      }
    }
  }

  for(var h=0;h<3;h++){
    armLE[h].classList.toggle("on", h===leftHand);
    handLE[h].classList.toggle("on", h===leftHand);
    armRE[h].classList.toggle("on", h===rightHand);
    handRE[h].classList.toggle("on", h===rightHand);
  }

  var rR=footTick>0 && footSide==="R", rL=footTick>0 && footSide==="L";
  legEls.R.setAttribute("height", rR?9:16);
  footEls.R.setAttribute("cy", rR?259:267);
  legEls.L.setAttribute("height", rL?9:16);
  footEls.L.setAttribute("cy", rL?259:267);
}

/* ============ input ============ */
function pressLeft(){
  resumeAudio();
  if(state!=="play") return;
  leftHand=(leftHand+1)%3;
  footSide="R"; footTick=2;
  blip(1250,0.02,"square",0.05);
  render();
}
function pressRight(){
  resumeAudio();
  if(state!=="play") return;
  rightHand=(rightHand+1)%3;
  footSide="L"; footTick=2;
  blip(1250,0.02,"square",0.05);
  render();
}

var btnL=$("btnL"), btnR=$("btnR");
function wire(el,fn){
  el.addEventListener("touchstart",function(e){ e.preventDefault(); fn(); },{passive:false});
  el.addEventListener("mousedown",function(e){ e.preventDefault(); fn(); });
}
wire(btnL,pressLeft); wire(btnR,pressRight);

document.querySelectorAll(".pill").forEach(function(btn){
  btn.addEventListener("click",function(){
    resumeAudio();
    var a=btn.dataset.act;
    if(a==="a") newGame("A");
    else if(a==="b") newGame("B");
    else if(a==="reset") attract();
    else if(a==="snd"){
      soundOn=!soundOn;
      btn.innerHTML="SOUND&nbsp;"+(soundOn?"&#9679;":"&#9675;");
    }
  });
});

window.addEventListener("keydown",function(e){
  var kk=(e.key||"").toLowerCase();
  if(e.repeat) return;
  if(kk==="arrowleft"||kk==="a"){ e.preventDefault(); pressLeft(); }
  else if(kk==="arrowright"||kk==="d"){ e.preventDefault(); pressRight(); }
  else if(kk==="1"){ newGame("A"); }
  else if(kk==="2"){ newGame("B"); }
  else if(kk==="r"){ attract(); }
});

/* block mobile zoom / long-press menu */
document.addEventListener("gesturestart",function(e){ e.preventDefault(); });
document.addEventListener("dblclick",function(e){ e.preventDefault(); },{passive:false});
$("console").addEventListener("contextmenu",function(e){ e.preventDefault(); });
var lastTouchEnd=0;
document.addEventListener("touchend",function(e){
  var now=Date.now();
  if(now-lastTouchEnd<=320) e.preventDefault();
  lastTouchEnd=now;
},{passive:false});

/* ============ responsive fit ============ */
function fit(){
  var c=$("console");
  c.style.transform="scale(1)";
  var r=c.getBoundingClientRect();
  var k=Math.min(window.innerWidth/(r.width+18), window.innerHeight/(r.height+18), 1.45);
  c.style.transform="scale("+k+")";
}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){ setTimeout(fit,200); });

/* ============ boot ============ */
build();
attract();
fit();
setTimeout(fit,120);

})();
</script>
</body>
</html>
